 hof_ic_ending_choice_tt:0 "§Y$CHARACTER$§!很快会开始致力于研究国策§Y$FOCUS$§!。"

 # 列夫·托洛茨基 的终局二选一事件（heartofiron.1050）
 heartofiron.1050.t:0 "托洛茨基的抉择"
 heartofiron.1050.desc:0 "托洛茨基在最高苏维埃中已经站稳了脚跟。几条主张先后推行开来，剩下最后一件事没有决定：他到底要把这条路走到哪里去。\n\n「要求我放弃政治活动，意味着要求我放弃为全世界工人阶级利益而进行的斗争，而这一斗争我已孜孜不倦地进行了 32 年之久，也就是我自觉生命的全部时间。只有腐朽透顶的官僚集团才会要求做出这种放弃。」\n\n「请告诉我还有哪个人能在一年之内建立起一支堪称楷模的军队而且赢得军事专家的尊重；我们有这样的人，就有了一切，我们将创造出奇迹。」\n\n问题是，应该走哪一条路？"
 heartofiron.1050.a:0 "把革命推向全世界"
 heartofiron.1050.b:0 "先把这个国家建设起来"

 # 格里戈里·季诺维也夫 的终局二选一事件（heartofiron.1051）
 heartofiron.1051.t:0 "季诺维也夫的抉择"
 heartofiron.1051.desc:0 "季诺维也夫在最高苏维埃中已经站稳了脚跟。第三国际是他缔造的，条件是他说了算，支线也铺到了各个大陆——剩下最后一件事没有决定：这个国际到底要长成什么样子。\n\n「共产国际看到了这种危险性，就从自我保护的朴素感情出发，必须采取相应的措施。因此就产生了著名的二十一条，后来围绕这个二十一条展开了非常激烈的斗争。」\n\n「把工会争取过来，意味着赢得了所有的加入组织的工人，甚至是赢得了所有的工人。而赢得所有的工人，意味着打垮资产阶级，使无产阶级革命获得胜利。」\n\n「统一战线的策略不仅同布尔什维克化不矛盾，而且是它的重要组成部分。没有这个策略就不可能有布尔什维克化。」\n\n问题是，铁板一块，还是把门打开？"
 heartofiron.1051.a:0 "把纪律贯彻到底"
 heartofiron.1051.b:0 "先把群众争取过来"

 # 列夫·托洛茨基 的岔路二选一事件（heartofiron.1060）
 heartofiron.1060.t:0 "经济的岔路口"
 heartofiron.1060.desc:0 "经济重建已经压到了桌面上。托洛茨基手里有两种办法，而它们互相排斥——一旦走上其中一条，另一条就再也走不通了。\n\n先松开战时共产主义那套严苛的集中制，让市场力量运作起来；或者反过来，把军事纪律搬到经济上来，把士兵当作劳动军。\n\n问题是，应该走哪一条？"
 heartofiron.1060.a:0 "先让市场活起来"
 heartofiron.1060.b:0 "把军队变成劳动大军"

 # 尼古拉·布哈林 的岔路二选一事件（heartofiron.1061）
 heartofiron.1061.t:0 "路线之争"
 heartofiron.1061.desc:0 "布哈林一进门就得表明立场。他对过渡时期的判断，决定了他这条线往哪里走。\n\n「列宁教导说：工人阶级同农民的冲突根本不是不可避免的。托洛茨基教导说：这种冲突必定会发生。」\n\n话说到这个份上，只能选一边。"
 heartofiron.1061.a:0 "走过渡时期这一条路"
 heartofiron.1061.b:0 "一步跨过过渡时期"

