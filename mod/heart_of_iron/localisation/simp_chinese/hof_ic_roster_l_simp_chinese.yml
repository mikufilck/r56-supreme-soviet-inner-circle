 # 托洛茨基个人线 17 条国策（文案为史实/理论节选，来源见 docs/22 §4 / §8.2.4）
 # ---------------------------------------------------------------------------
 hof_ic_trotsky_build_the_red_army:0 "缔造红军"
 hof_ic_trotsky_build_the_red_army_desc:0 "「给我三千名逃兵组成一个团，我给他们派一名英勇善战的团长和一位优秀的政委，再给他们配上合适的营长、连长、排长——4 个星期之内，这三千名逃兵就可以成为我们这个革命国家中最优秀的团队。」"
 hof_ic_trotsky_military_specialists:0 "返聘沙俄军官"
 hof_ic_trotsky_military_specialists_desc:0 "「如果我们认为我们不能把成千上万名专家，其中包括军事专家争取到我们这边，那实在是对我们自己、我们的党、我们思想的精神力量以及我们革命道义的感召力的估计太低了。」"
 hof_ic_trotsky_against_partisan_warfare:0 "反对游击主义"
 hof_ic_trotsky_against_partisan_warfare_desc:0 "「必须在短期内从志愿兵制转入义务兵制，从游击队转入正规军编制。我们每天不断地与游击习气作斗争，这一斗争要求坚持不懈、毫不妥协，有时还需要采取严厉措施。反游击习气的斗争，就是为建设无产阶级国家制度，反对小资产阶级、无政府主义自发势力对它的侵袭的斗争。」"
 hof_ic_trotsky_uneven_and_combined_development:0 "不平衡与综合发展律"
 hof_ic_trotsky_uneven_and_combined_development_desc:0 "「落后国家虽不得不追随先进国家，但它并不遵守程序：历史的落后性的特权，允许、或更确切些说强迫一个落后国家去采取一些比预定日期更早完成的事物，去跳过许多中间阶段。野蛮人放下了弓箭，立刻拿起了步枪，他们并不经历过去介于两种武器之间的旅程。」"
 hof_ic_trotsky_permanent_revolution:0 "不断革命论"
 hof_ic_trotsky_permanent_revolution_desc:0 "「俄国当然不能独立地走到社会主义，但俄国开辟了社会主义革命纪元，就能够给欧洲社会主义发展以一个推动，以此方式，追随先进国家之后而走到社会主义。」"
 hof_ic_trotsky_socialism_in_one_country:0 "驳「一国社会主义」"
 hof_ic_trotsky_socialism_in_one_country_desc:0 "「1904—1905 年间，没有一个俄国马克思主义者曾经辩护过或曾经提出过在一个国家、尤其在俄国能建成社会主义制度的见解。这个见解第一次提出于印刷物上，是在二十年之后。」"
 hof_ic_trotsky_the_new_course:0 "新方针"
 hof_ic_trotsky_the_new_course_desc:0 "「我们认为自己的观点是正确的，在党的范围内保留捍卫自己观点的权利，并且拒绝一切可以导致分裂危险的行动。……它表达了我们要求留在党内为党服务的愿望。」"
 hof_ic_trotsky_against_the_bureaucracy:0 "反对官僚化"
 hof_ic_trotsky_against_the_bureaucracy_desc:0 "「无产阶级专政将通过政党夺取政权而建立，这个政党在革命中起领导作用。但是，一旦它的任务完成，这样的党要提防用自身代替无产阶级或是支配无产阶级。」"
 hof_ic_trotsky_limited_market_reforms:0 "有限市场化"
 hof_ic_trotsky_limited_market_reforms_desc:0 "「从乌拉尔我带回了大量经济考查材料，从中可以得出一个共同的结论：必须放弃战时共产主义。……为了经济的振兴必须不惜一切代价引入个人利益的因素，即在某种程度上恢复国内市场。我向中央委员会建议以征收粮食税代替余粮收集制，并建立商品交换制度。」"
 hof_ic_trotsky_labour_armies:0 "劳动军"
 hof_ic_trotsky_labour_armies_desc:0 "「既然转入市场机制的建议已被否决，我就要求正确地、系统地实行『战时』方法，以求取得实际的经济成果。在战时共产主义制度中，所有的物资至少在原则上都国有化，并根据国家命令分配。」"
 hof_ic_trotsky_state_planning:0 "经济计划化"
 hof_ic_trotsky_state_planning_desc:0 "「我一再肯定地说，我们现在还没有一个机关直接负责有计划地领导国有经济，并在其权利、职责和人员方面都能实施这种领导。我认为，最近时期我们经济政策的失误在于孤立地提出财政问题——不稳定的卢布不可能成为经济的调节者。」"
 hof_ic_trotsky_accelerated_industrialization:0 "加速工业化"
 hof_ic_trotsky_accelerated_industrialization_desc:0 "「我国经济发展的速度，首先是工业化的速度问题，因此具有决定性意义。断言我们可以用乌龟爬行速度来建设社会主义，这是胡说——世界市场不等待，庄稼汉不想等待。」"
 hof_ic_trotsky_the_comintern_manifesto:0 "共产国际宣言"
 hof_ic_trotsky_the_comintern_manifesto_desc:0 "「我们提出的世界革命方针，整个来说，是否依然完全正确？……我们过去和现在都决心把握每一个时机，不论在形式上有什么变化，来发起革命。」"
 hof_ic_trotsky_the_chinese_question:0 "中国革命问题"
 hof_ic_trotsky_the_chinese_question_desc:0 "「任务中的任务，竟不是数百万工人在职工会与共产党领导之下的觉醒与统一，不是将贫苦的农民与手艺工人吸引至运动的主流——不是的，『任务中的任务』乃是国民党的地位！」"
 hof_ic_trotsky_united_front:0 "反法西斯统一战线"
 hof_ic_trotsky_united_front_desc:0 "「这并不是说我们否认联合战线的重要性。我们需要的联合战线，是在各阶级政党的领导人一致反抗法西斯主义的时候。……只有群众性斗争才能决定局势。」"
 hof_ic_trotsky_the_permanent_revolutionary:0 "永久的革命者"
 hof_ic_trotsky_the_permanent_revolutionary_desc:0 "「要求我放弃政治活动，意味着要求我放弃为全世界工人阶级利益而进行的斗争，而这一斗争我已孜孜不倦地进行了 32 年之久，也就是我自觉生命的全部时间。只有腐朽透顶的官僚集团才会要求做出这种放弃，只有卑鄙的叛徒才能做出这种承诺。」"
 hof_ic_trotsky_the_builder_of_the_state:0 "国家建设者"
 hof_ic_trotsky_the_builder_of_the_state_desc:0 "「我们之所以用随机应变的措施来代替制度，为的是今后能在这些措施的基础上建立起可依靠的制度。我们不希望在建成健全的制度之前就被消灭。」"

 # ---------------------------------------------------------------------------
 # 布哈林个人线 9 条国策（文案为史实/理论节选，来源见 docs/26 §4 / §7.3）
 # ---------------------------------------------------------------------------
 hof_ic_bukharin_economics_of_transition:0 "过渡时期的经济"
 hof_ic_bukharin_economics_of_transition_desc:0 "这种联盟的路线是过渡时期全部政策的实质。因为过渡时期最明显的特点主要是两阶级社会，在这样的社会里，城市和农村、工业和农业、大生产和小生产、合理的计划和无政府主义的市场等等问题表现了主要的阶级问题，即工人阶级和农民之间的相互关系问题。"
 hof_ic_bukharin_nep_is_not_a_retreat:0 "新经济政策不是退却"
 hof_ic_bukharin_nep_is_not_a_retreat_desc:0 "或者我们在过渡时期要建立无产阶级领导下的工农联盟，那么，这条路线应当是我们各种活动的基本原则。"
 hof_ic_bukharin_abolish_the_tribute:0 "取消「贡款」"
 hof_ic_bukharin_abolish_the_tribute_desc:0 "无产阶级不是农民的剥削者，也不可能是农民的剥削者。请取消您的『贡款』，哪怕作为失言也罢！……贡款是非常明确的历史范畴，它同社会主义毫无共同之处，也不可能有共同之处！不能这样轻率地对待理论观点。这是无知，是有害的！"
 hof_ic_bukharin_alliance_is_the_axis:0 "工农联盟是轴心"
 hof_ic_bukharin_alliance_is_the_axis_desc:0 "在上次辩论中提出的零散的问题……这一切现在都归结为某些基本的方面……而所有这些本身极重大的问题所围绕的轴心就是工农联盟问题。"
 hof_ic_bukharin_enrich_yourselves:0 "发财吧"
 hof_ic_bukharin_enrich_yourselves_desc:0 "我们农村政策的发展趋势应当是，要放宽妨碍富裕农民和富农经济发展的许多限制，有一部分甚至要废除。应当向农民，向全体农民说：发财吧！发展自己的经济吧！用不着担心，不会有人无情地欺负你们！"
 hof_ic_bukharin_proportional_development:0 "按比例发展"
 hof_ic_bukharin_proportional_development_desc:0 "价值规律在消亡。但按比例的劳动消耗规律仍存在。……要跳出这一规律是绝对不行的。"
 hof_ic_bukharin_cooperatives_into_the_system:0 "合作社长入"
 hof_ic_bukharin_cooperatives_into_the_system_desc:0 "我国基本的农民合作社组织网将不是由富农式的而是『劳动』式的基层合作社细胞构成，这些细胞将长入到体系中去，长入到我们的一般国家机关的体系中去，并通过这一途径成为社会主义经济的单一链条中的环节。"
 hof_ic_bukharin_left_communism:0 "左翼共产主义"
 hof_ic_bukharin_left_communism_desc:0 "列宁教导说：工人阶级同农民的冲突根本不是不可避免的。托洛茨基教导说：这种冲突必定会发生。"
 hof_ic_bukharin_socialism_in_one_country:0 "一国建成社会主义"
 hof_ic_bukharin_socialism_in_one_country_desc:0 "我们不会由于国内的阶级差别和我们技术上的落后而灭亡，甚至在低下的技术基础上我们也能够建设社会主义，社会主义的这种发展将非常缓慢，我们将以乌龟速度爬行，但我们终究在建设社会主义，并且我们定将建成它。"

 # ---------------------------------------------------------------------------
 # 李可夫个人线 5 条国策（文案为史实/理论节选，来源见 docs/30 §1 / §2）
 # ---------------------------------------------------------------------------
 hof_ic_rykov_supreme_economic_council:0 "最高国民经济委员会主席"
 hof_ic_rykov_supreme_economic_council_desc:0 "「现在最高国民经济委员会担负着一项困难而又最能收效的任务。……在剥削者的反抗被彻底粉碎以后，在劳动者学会组织社会主义生产以后，这种原来意义的、狭义的管理机构，旧国家的机构，必定消亡，而最高国民经济委员会这样的机构必定成长、发展和巩固，它将担负起有组织的社会的一切最主要的活动。」"
 hof_ic_rykov_food_supply_commissar:0 "劳动国防委员会粮秣特派员"
 hof_ic_rykov_food_supply_commissar_desc:0 "「一个有一定效能的统一供给前线和全军的军需机构逐渐建立起来了。……同时切不可忘记，我们是在没有物资储备的情况下作战的。早在 1919 年，中央仓库已经告罄。军衬衣刚刚缝好就送上前线，枪支弹药的情况更糟。图拉的几家兵工厂的产品都是现产现运，没有总司令的签字，一车皮的弹药也不能动用。」"
 hof_ic_rykov_labour_defence_council:0 "劳动与国防委员会副主席"
 hof_ic_rykov_labour_defence_council_desc:0 "「国家计划委员会目前的状况根本不可能真正有计划地领导经济工作。……劳动国防委员会的任务是确定经济政策的基本原则，对经济工作进行全面监督，具体解决其他各级经济组织解决不了的棘手问题。」"
 hof_ic_rykov_sponsor_aviation:0 "扶植航空"
 hof_ic_rykov_sponsor_aviation_desc:0 "雅科夫列夫最初的一批飞机，家族名就叫 АИР——以阿列克谢·伊万诺维奇·李可夫命名。第一架飞机取名「А. И. 李可夫」，是为了感谢这位自学成才的设计师从 1923 年刚入航空业起，就持续得到航空之友协会（ОДВФ）及其后继者阿维阿希姆的支持；而自 ОДВФ 1923 年成立起，这一组织的主席就是李可夫本人。航空之友协会当年就发展到二百万人，АИР 这个名字一直用到 1937 年的 АИР-18。"
 hof_ic_rykov_labour_defence_chair:0 "劳动与国防委员会主席"
 hof_ic_rykov_labour_defence_chair_desc:0 "「这个在最高国民经济委员会内制定、还没有得到批准的五年计划，无疑将被国家计划委员会、劳动国防委员会等加以削减，因为该计划要求投入的基本建设资金和整个拨款额大大超过了党和经济领导机关的预测。」"

 # ---------------------------------------------------------------------------
 # 季诺维也夫个人线 11 条国策（文案为史实/理论节选，来源见 docs/33 §1 / §2）
 # ---------------------------------------------------------------------------
 hof_ic_zinovyev_found_the_comintern:0 "缔造第三国际"
 hof_ic_zinovyev_found_the_comintern_desc:0 "「我们党认为，正式成立第三国际的时机已经完全成熟，因此我曾建议就在这第一次代表大会上成立第三国际。」"
 hof_ic_zinovyev_twenty_one_conditions:0 "加入共产国际的条件"
 hof_ic_zinovyev_twenty_one_conditions_desc:0 "「共产国际看到了这种危险性，就从自我保护的朴素感情出发，必须采取相应的措施。因此就产生了著名的二十一条，后来围绕这个二十一条展开了非常激烈的斗争。」"
 hof_ic_zinovyev_social_fascism:0 "社会法西斯主义"
 hof_ic_zinovyev_social_fascism_desc:0 "「在意大利，法西斯主义是资本主义资产阶级和社会民主党两种倾向的综合体，社会民主党则是法西斯主义的一翼。……包含着把社会民主党看作是资产阶级『第三』党的说法的第五次代表大会的提纲是完全正确的。」"
 hof_ic_zinovyev_bolshevization:0 "布尔什维克化"
 hof_ic_zinovyev_bolshevization_desc:0 "「工人运动的真正布尔什维克化是一个不断的过程。……布尔什维克化就在于学会从俄国的经验中，同样地，也从其他国家的斗争经验中吸取最本质的教训，把它们同某个国家的具体条件和要求结合起来。」"
 hof_ic_zinovyev_congress_of_the_east:0 "东方各民族代表大会"
 hof_ic_zinovyev_congress_of_the_east_desc:0 "「只有欧美工人和亚非劳动群众的共同胜利才能给迄今为止一直为一小撮富人过上舒服生活而劳动的人带来解放。如果仅仅你们获得了自由，而我们还处于被奴役之中，那么你们自己很快就会重新沦为奴隶。」"
 hof_ic_zinovyev_workers_united_front:0 "工人统一战线"
 hof_ic_zinovyev_workers_united_front_desc:0 "「共产党现在可以而且应当收获自己过去在群众漠不关心的十分不利的情况下所进行的斗争的果实。……共产党现在应当在一切场合下竭力使这些群众的实际行动尽可能达到更广泛和更完全的统一。」"
 hof_ic_zinovyev_speed_and_route:0 "革命的速度与路线"
 hof_ic_zinovyev_speed_and_route_desc:0 "「俄国革命胜利后，我们大家都一致认为，下一次将轮到德国了……只是在现在……才坚定不移地提出一个问题：革命是否必定通过德国移向欧洲？……可能出现的情况是：未来的行进路线不一定首先通过德国革命。」"
 hof_ic_zinovyev_party_in_revolution:0 "党在无产阶级革命中的作用"
 hof_ic_zinovyev_party_in_revolution_desc:0 "「没有强大的共产党，就不可能把无产阶级从资本主义的压迫下解放出来。共产党是工人阶级的大脑。共产党是无产阶级的眼睛。……共产党是工人阶级的先锋队。」"
 hof_ic_zinovyev_trade_unions:0 "论工会的作用"
 hof_ic_zinovyev_trade_unions_desc:0 "「可以毫不夸大地说，现在第三国际反对其一切敌人的斗争十分之九在最近时期将在工会运动中进行。……把工会争取过来，意味着赢得了所有的加入组织的工人，甚至是赢得了所有的工人。而赢得所有的工人，意味着打垮资产阶级，使无产阶级革命获得胜利。」"
 hof_ic_zinovyev_monolithic_international:0 "铁板一块的国际"
 hof_ic_zinovyev_monolithic_international_desc:0 "「没有共产党的铁的专政，苏维埃政权不仅不能维持 3 年，而且连 3 个月也维持不了。每一个有觉悟的工人应当懂得，工人阶级专政不可能不通过它的先锋队，即共产党的专政来实现。」"
 hof_ic_zinovyev_mass_international:0 "群众的国际"
 hof_ic_zinovyev_mass_international_desc:0 "「要成为一个群众工作者，必须持续不断地向工人群众保持联系，其中也包括同社会民主党工人和无党派工人保持联系。」"

 # ---------------------------------------------------------------------------
 # 加米涅夫个人线 5 条国策（文案为史实/理论节选，来源见 docs/36 §1 / §2）
 # ---------------------------------------------------------------------------
 hof_ic_kamenev_lenins_charge:0 "列宁的托付"
 hof_ic_kamenev_lenins_charge_desc:0 "「如果我被杀死，我请您出版我的笔记《马克思主义论国家》。」\n\n—— 列宁 1917 年 7 月躲藏时写给他的信"
 hof_ic_kamenev_leninism:0 "列宁主义"
 hof_ic_kamenev_leninism_desc:0 "「列宁开始进行自己的工作的时候，恰好人类——全世界从资本主义表面上和平的、有机的发展转向新的世界历史时代，转向无产阶级革命的纪元。……这就使马克思主义变成了列宁主义。」"
 hof_ic_kamenev_against_the_lessons:0 "驳《十月教训》"
 hof_ic_kamenev_against_the_lessons_desc:0 "「事情以我们党中央在报刊上对这些辞职的同志进行非常严厉的批评告终。而几周之后，至多几个月之后，所有这些同志都承认了自己的错误，回到了他们负责的党和苏维埃岗位上。」"
 hof_ic_kamenev_lenin_institute:0 "列宁研究院与全集"
 hof_ic_kamenev_lenin_institute_desc:0 "「我们必须把注意力转向劳动群众，把那些被资产阶级和沙皇政府藏了数十年的列宁著作交到他们手里。把列宁的著作交给劳动群众，就意味着加速他们的胜利。为此必须倾注我们全部的力量。」"
 hof_ic_kamenev_executor_of_the_will:0 "列宁的遗嘱执行人"
 hof_ic_kamenev_executor_of_the_will_desc:0 "「一切与列宁有关的东西都重要。而极其重要的是列宁的著作将以何种形式交给世界无产阶级。」"

 # ---------------------------------------------------------------------------
 # 斯米尔诺夫个人线 6 条国策（文案为史实/理论节选，来源见 docs/39 §1 / §2）
 # ---------------------------------------------------------------------------
 hof_ic_smirnov_the_volga_bridgehead:0 "斯维亚日斯克桥头堡"
 hof_ic_smirnov_the_volga_bridgehead_desc:0 "「拉里莎·赖丝纳把伊万·尼基季奇叫作『斯维亚日斯克的良心』。她写道：伊万·尼基季奇最受人们尊敬，因为大家都感觉到，在最危急的时刻，最沉着无畏的就是他。」"
 hof_ic_smirnov_the_fifth_army:0 "第五集团军与「五军将士」"
 hof_ic_smirnov_the_fifth_army_desc:0 "「第五军的共产党员团结在斯米尔诺夫周围，形成了一个特殊的政治家庭……『五军将士』这个词在革命词典中有其特殊的意义，它意味着真正的革命者、克尽职守的人，更主要的是纯洁的人。」"
 hof_ic_smirnov_sibrevkom:0 "西伯利亚革命委员会"
 hof_ic_smirnov_sibrevkom_desc:0 "「列宁建议把苏维埃化和安抚西伯利亚的任务交给伊万·尼基季奇……多亏他，亚洲北部的苏维埃化，在那里白军表现得极其残忍，几乎是在没有报复行动的情况下完成的。」"
 hof_ic_smirnov_far_eastern_republic:0 "远东共和国"
 hof_ic_smirnov_far_eastern_republic_desc:0 "「斯米尔诺夫创建了远东共和国——一个临时的缓冲国，使苏维埃得以避开与日本的战争。」"
 hof_ic_smirnov_posts_and_telegraphs:0 "苏联邮电人民委员部"
 hof_ic_smirnov_posts_and_telegraphs_desc:0 "「国内战争结束后，五军将士同伊万·尼基季奇一起把他们的英雄主义转移到经济建设领域。……斯米尔诺夫先领导国防工业，后来任邮电人民委员。」"
 hof_ic_smirnov_siberian_lenin:0 "西伯利亚的列宁"
 hof_ic_smirnov_siberian_lenin_desc:0 "「伊万·尼基季奇永远是个忠于职守的人，在这一点上，一个革命者接近于一个优秀军人，因而革命者可以成为一名优秀军人。伊万·尼基季奇只服从他的本性，他永远是勇敢、坚强的典范。」"

 # ---------------------------------------------------------------------------
 # 谢列布里亚科夫个人线 5 条国策（文案为史实/理论节选，来源见 docs/42 §1 / §2）
 # ---------------------------------------------------------------------------
 hof_ic_serebryakov_kostroma:0 "科斯特罗马的驻军"
 hof_ic_serebryakov_kostroma_desc:0 "1917 年 2 月，他把一团人带出营房支持革命，并成为科斯特罗马工兵代表苏维埃的组建者之一。"
 hof_ic_serebryakov_central_committee:0 "党中央书记处"
 hof_ic_serebryakov_central_committee_desc:0 "「列宁、加米涅夫、克列斯京斯基、加里宁、谢列布里亚科夫、斯大林、斯塔索娃。」"
 hof_ic_serebryakov_commissariat_of_transport:0 "交通人民委员部"
 hof_ic_serebryakov_commissariat_of_transport_desc:0 "第一次世界大战与国内战争中，60% 以上的路网、90% 的机车、80% 的车厢被毁。"
 hof_ic_serebryakov_highways_and_motor_transport:0 "公路与汽车运输总局"
 hof_ic_serebryakov_highways_and_motor_transport_desc:0 "1921 年起，汽车、畜力与有轨电车运输的管理权移交给交通人民委员部。"
 hof_ic_serebryakov_brilliant_worker:0 "天才的工人"
 hof_ic_serebryakov_brilliant_worker_desc:0 "「列宁称我的父亲为天才的工人。」"

 # ---------------------------------------------------------------------------
 # 普列奥布拉任斯基个人线 5 条国策（文案为史实/理论节选，来源见 docs/45 §1 / §2）
 # ---------------------------------------------------------------------------
 hof_ic_preobrazhensky_agrarian_theses:0 "农村政策提纲"
 hof_ic_preobrazhensky_agrarian_theses_desc:0 "「国家还必须向这一阶层加重（同中农和贫农相比）征收实物税和货币税，让它承担更多的社会义务，同时为了不致破坏富农和富裕农民的经济，在可行范围内利用农村中业已开始的资本主义积累过程来增加社会主义积累。」"
 hof_ic_preobrazhensky_scissors:0 "压缩剪刀差"
 hof_ic_preobrazhensky_scissors_desc:0 "「党在新经济政策时期的基本任务仍然是巩固国营工业和农业的结合，而在现阶段是压缩所谓剪刀差。」"
 hof_ic_preobrazhensky_against_nepmen:0 "反对耐普曼的积累"
 hof_ic_preobrazhensky_against_nepmen_desc:0 "「必须加强斗争反对新经济政策时期中的积累。」"
 hof_ic_preobrazhensky_two_regulators:0 "两种规律的斗争"
 hof_ic_preobrazhensky_two_regulators_desc:0 "「在普列奥布拉任斯基那里，农村只是工业的奶牛。」\n\n—— 人民委员会主席李可夫对《新经济学》的评语"
 hof_ic_preobrazhensky_primitive_accumulation:0 "社会主义原始积累"
 hof_ic_preobrazhensky_primitive_accumulation_desc:0 "「社会主义原始积累规律」—— 为了保障工业化的积累，必须「剥削前社会主义的经济形式」。"

 # ---------------------------------------------------------------------------
 # 拉狄克个人线 9 条国策（文案为史实/理论节选，来源见 docs/48 §1 / §2）
 # ---------------------------------------------------------------------------
 hof_ic_radek_central_europe_department:0 "外交人民委员部中欧司"
 hof_ic_radek_central_europe_department_desc:0 "「在布列斯特和约签订以后，我领导了外交人民委员部的中欧司和中央执行委员会的对外关系司。」"
 hof_ic_radek_founding_of_the_kpd:0 "德国共产党的第一次代表大会"
 hof_ic_radek_founding_of_the_kpd_desc:0 "「我参加了德国共产党第一次代表大会的组织工作。在罗莎·卢森堡和李卜克内西被害以后，我秘密地留在柏林，并参加了党的领导工作。」"
 hof_ic_radek_seven_pamphlets:0 "狱中的七本小册子"
 hof_ic_radek_seven_pamphlets_desc:0 "「我于 2 月 15 日被捕，坐牢到 12 月份，从那里我出版了七本探讨众人注目的德国工人运动问题的小册子，积极地参与了德国共产党的领导工作。」"
 hof_ic_radek_german_october:0 "德国十月"
 hof_ic_radek_german_october_desc:0 "「在回俄国的途中，我受共产国际的派遣在 10 月间参与领导预定的起义。10 月 22 日我回来的时候，退却已经开始。我赞同中央委员会的这一决定。」"
 hof_ic_radek_sunyatsen_university:0 "中山大学"
 hof_ic_radek_sunyatsen_university_desc:0 "「从 1925 年起我是中山大学的校长，并参加苏联大百科全书编辑部的工作。」"
 hof_ic_radek_the_struggle_for_power_in_china:0 "中国的夺权斗争"
 hof_ic_radek_the_struggle_for_power_in_china_desc:0 "「各省督军之间的斗争使中国国力日衰，但是，这种斗争拖延下去，各派军阀的力量也受到严重消耗，这就使中国的危机日益尖锐，迫使小资产阶级知识分子势力（这种势力在中国相当大）组织起来并试图从下面采取革命的方法来解决军事资本集团无法解决的中国统一问题。」"
 hof_ic_radek_the_condition_of_the_chinese_working_class:0 "中国工人阶级的状况"
 hof_ic_radek_the_condition_of_the_chinese_working_class_desc:0 "「我们对于东方产业工人的状况知道得如此之少，因而对于任何一种让欧洲读者看到他们亚洲阶级弟兄生活境况的新的努力都应当表示欢迎。」"
 hof_ic_radek_social_and_political_thought:0 "社会政治思想"
 hof_ic_radek_social_and_political_thought_desc:0 "「孙中山对资本主义发展进程的分析是从生产成果分配不合理这一角度出发的，而不是以生产本身发生的变革为出发点。」"
 hof_ic_radek_red_publicist:0 "红色笔杆子"
 hof_ic_radek_red_publicist_desc:0 "「在革命的所有年代里，我是《真理报》和《消息报》的撰稿人。我写的主要是关于对外政策和国际工人运动问题的文章。」"

 # ---------------------------------------------------------------------------
 # 斯米尔加个人线 6 条国策（文案为史实/理论节选，来源见 docs/51 §1 / §2）
 # ---------------------------------------------------------------------------
 hof_ic_smilga_finland:0 "芬兰的军队与舰队"
 hof_ic_smilga_finland_desc:0 "9 月，斯米尔加率领布尔什维克代表团出席赫尔辛基第三届区域苏维埃代表大会，并当选为区域苏维埃委员会主席。十月革命前夕，他受命返回芬兰，把 1500 名武装水兵送往彼得格勒，作为后备力量。"
 hof_ic_smilga_fuel_main_directorate:0 "燃料总局"
 hof_ic_smilga_fuel_main_directorate_desc:0 "作为燃料管理局局长，斯米尔加是最早尝试为苏联工业的某一部分制定计划的苏联行政官员之一。作为一个计划化的信徒，他抱怨说：「国家机关的某些分子（而机关在很大程度上也是旧秩序的遗产）总体上反对计划。」"
 hof_ic_smilga_gosplan:0 "国家计划委员会"
 hof_ic_smilga_gosplan_desc:0 "「1923 年秋 — 1926 年 11 月 23 日 —— 斯米尔加，伊瓦尔·捷尼索维奇 —— 副主席」\n\n—— 苏联国家计划委员会历任副主席名单"
 hof_ic_smilga_economics_institute:0 "莫斯科国民经济学院"
 hof_ic_smilga_economics_institute_desc:0 "1924—1927 年，他任莫斯科国民经济学院院长，并在该院讲授苏联经济政策课程。"
 hof_ic_smilga_productive_forces:0 "生产力布局"
 hof_ic_smilga_productive_forces_desc:0 "「《第二个五年计划中生产力布局的基本路线》」（1932 年）—— 这是他 20 部著作里的最后一部，也是他第二次任国家计划委员会副主席期间的工作。"
 hof_ic_smilga_the_healer_of_the_gaps:0 "弥合裂缝的人"
 hof_ic_smilga_the_healer_of_the_gaps_desc:0 "「在最初五年间，基本的倾向是弥合分歧 —— 旧的裂缝修补了，老的创伤平复了，反对者和好了，等等。而在后来的五年内，自 1923 年起，情况倒了过来；一切裂缝扩大了，一切分歧扩大并尖锐化了，所有的创伤化脓了。」"

 # ---------------------------------------------------------------------------
 # 托姆斯基个人线 6 条国策（文案为史实/理论节选，来源见 docs/54 §1 / §2）
 # ---------------------------------------------------------------------------
 hof_ic_tomsky_printers_union:0 "印刷工人工会"
 hof_ic_tomsky_printers_union_desc:0 "1906 年 8 月他回到彼得格勒，集中做工会组织：他为彼得堡印刷工人工会争到了一纸集体合同；1907 年他又组建了雕版工与石印工人工会并担任主席，随后把这个行会与石印工与印刷工人工会合并。"
 hof_ic_tomsky_moscow_trade_union_council:0 "莫斯科工会理事会"
 hof_ic_tomsky_moscow_trade_union_council_desc:0 "1917 年 10 月 28 日，莫斯科军事革命委员会派托姆斯基前往彼得格勒；10 月 29 日列宁听取了他的报告，并答应援助莫斯科的革命力量。同年 12 月他当选莫斯科工会理事会主席。"
 hof_ic_tomsky_central_council_of_trade_unions:0 "全苏工会中央理事会"
 hof_ic_tomsky_central_council_of_trade_unions_desc:0 "「1918 年 10 月 9 日，全苏工会中央理事会执行委员会选举托姆斯基为执行局主席。」—— 全苏工会中央理事会历任主席名单：1918—1921 —— 托姆斯基；1922—1929 —— 托姆斯基。"
 hof_ic_tomsky_platform_of_ten:0 "「十人纲领」"
 hof_ic_tomsky_platform_of_ten_desc:0 "「托姆斯基同志和其他的工会工作者反对的是对工会搞『骑兵式的袭击』。」「而事实上工会在这场争论中完全正确。」"
 hof_ic_tomsky_the_silence_of_1921:0 "1921 年 5 月的沉默"
 hof_ic_tomsky_the_silence_of_1921_desc:0 "在第四届工会代表大会上，梁赞诺夫提出了工会独立于党的决议案。中央责成托姆斯基发言反对这一方案，他没有这样做，决议遂按梁赞诺夫的版本获得通过。中央全会随后严厉谴责了梁赞诺夫和托姆斯基，并把托姆斯基撤出工会工作。"
 hof_ic_tomsky_man_from_tomsk:0 "来自托木斯克的人"
 hof_ic_tomsky_man_from_tomsk_desc:0 "「托姆斯基是这样描述的：我（托姆斯基）在国际事务中比你（布哈林）右 30 公里，但是我（托姆斯基）比斯大林左 100 公里。」"

 # ---------------------------------------------------------------------------
 # 里亚京个人线 5 条国策（文案为史实/理论节选，来源见 docs/57 §1 / §2）
 # ---------------------------------------------------------------------------
 hof_ic_ryutin_struggle_magazine:0 "《斗争》杂志"
 hof_ic_ryutin_struggle_magazine_desc:0 "1917 年 9 月至 12 月，他任哈尔滨工人与士兵代表苏维埃主席；同年在哈尔滨编辑《斗争》杂志，并担任俄国社会民主工党（布）哈尔滨委员会主席。"
 hof_ic_ryutin_red_star:0 "《红星报》"
 hof_ic_ryutin_red_star_desc:0 "1928 年秋他被任命为《红星报》副编辑 —— 这是红军机关报 —— 同时继续担任联共（布）中央候补委员。"
 hof_ic_ryutin_soyuzkino:0 "苏联电影"
 hof_ic_ryutin_soyuzkino_desc:0 "「1930 年 2 月 13 日苏联人民委员会决议成立国家电影照相联合公司『Союзкино』；理事会共 7 人，米·尼·留京任主席。1930 年 8 月 25 至 31 日召开第一次全苏『Союзкино』有声电影生产-技术会议，会议决定组织有声电影的生产。」\n\n—— 苏联国家电影照相联合公司机构条目"
 hof_ic_ryutin_union_of_marxist_leninists:0 "马列主义者联盟"
 hof_ic_ryutin_union_of_marxist_leninists_desc:0 "「恢复之前开除出党的人的党籍（包括托洛茨基），并『重新开始』。」"
 hof_ic_ryutin_verkhne_ryutino:0 "上留京诺的留京"
 hof_ic_ryutin_verkhne_ryutino_desc:0 "「由于我绝对确信自己无罪，并认为现在的起诉绝对非法、专横和偏袒，完全出于敌意和对一次新的、这次是血腥的报复的渴望，我已断然拒绝并将继续拒绝对我的指控认罪。」"

 # ---------------------------------------------------------------------------
 # 施利亚普尼科夫个人线 6 条国策（文案为史实/理论节选，来源见 docs/60 §1 / §2）
 # ---------------------------------------------------------------------------
 hof_ic_shlyapnikov_workers_control:0 "工人监督"
 hof_ic_shlyapnikov_workers_control_desc:0 "作为劳动人民委员，他帮助起草了关于工人对工业的监督与工业国有化的重要指令。"
 hof_ic_shlyapnikov_not_syndicalism:0 "不是工团主义"
 hof_ic_shlyapnikov_not_syndicalism_desc:0 "「现在工人工会对国民经济机构消极协作，应吸引前者积极与个体参与整个国民经济的管理。」"
 hof_ic_shlyapnikov_producers_congress:0 "生产者代表大会"
 hof_ic_shlyapnikov_producers_congress_desc:0 "「我们认为，我国生产力的恢复和发展，只有改变国民经济管理的整个组织体系之条件下，才有可能。」"
 hof_ic_shlyapnikov_through_the_workers:0 "通过工人，还是瞒着工人"
 hof_ic_shlyapnikov_through_the_workers_desc:0 "「争论的本质，在于正在经历的过渡时刻中，我们共产党将推行自己的经济政策，是通过组织在工会里的工人群众呢，还是瞒着他们，用官僚手段，通过典范的官员呢？」"
 hof_ic_shlyapnikov_qualification_from_the_shop:0 "生产的资格"
 hof_ic_shlyapnikov_qualification_from_the_shop_desc:0 "在 1922 年 3 月的第十一次代表大会上，工人反对派要求在领导层里清除「白手套」，并要求每个党的官员一年中至少有三个月在工业或农业中从事体力劳动。"
 hof_ic_shlyapnikov_the_body_they_elect:0 "由他们选出的机关"
 hof_ic_shlyapnikov_the_body_they_elect_desc:0 "「管理国民经济之权应当属于联合在各种产业工会中的生产者的全俄代表大会，应当由他们选出中央机关来管理整个国民经济。」"

 # ---------------------------------------------------------------------------
 # 加里宁个人线 6 条国策（文案为史实/理论节选，来源见 docs/62 §1 / §2）
 # ---------------------------------------------------------------------------
 hof_ic_kalinin_a_peasant_head_of_state:0 "农民出身的元首"
 hof_ic_kalinin_a_peasant_head_of_state_desc:0 "就在 1919 年，加里宁作为接近中农并较了解他们疾苦的人，当选为中央执行委员会主席。"
 hof_ic_kalinin_down_with_illiteracy:0 "扫除文盲"
 hof_ic_kalinin_down_with_illiteracy_desc:0 "1923 年他出任「扫除文盲」协会主席，协调全苏的教育工作。协会名下在全国建立了 1.1 万个扫盲点；到 1930 年代末，识字率逼近 90%。"
 hof_ic_kalinin_the_state_of_the_whole_people:0 "全民国家"
 hof_ic_kalinin_the_state_of_the_whole_people_desc:0 "1926 年，他第一次在苏联的政治话语里提出：无产阶级专政的国家，应当逐步被「全民国家」所取代。"
 hof_ic_kalinin_the_reception_room:0 "接待室"
 hof_ic_kalinin_the_reception_room_desc:0 "苏联公民习惯写信给他：被没收、被冤捕、想进军校、找不到工作。二十五年间，约八百万人走过他的接待室，很多请求被满足。"
 hof_ic_kalinin_an_unfounded_operation:0 "没有根据的行动"
 hof_ic_kalinin_an_unfounded_operation_desc:0 "1932 年 5 月 4 日，在关于流放 38 000 户农民家庭的表决单上，他写下一句：「我认为这样的行动没有根据。」两周后，政治局撤销了这个决定。"
 hof_ic_kalinin_the_all_union_elder:0 "全联盟的老家长"
 hof_ic_kalinin_the_all_union_elder_desc:0 "他做了二十七年国家元首，人们叫他「全联盟的老家长」。晚年他在中央委员会里说：「我是全联盟的老家长，谁都认识我。」"

 # ---------------------------------------------------------------------------
 # 李维诺夫个人线 6 条国策（文案为史实/理论节选，来源见 docs/65 §2 / §7）
 # ---------------------------------------------------------------------------
 hof_ic_litvinov_a_courier_of_iskra:0 "火星报的代办员"
 hof_ic_litvinov_a_courier_of_iskra_desc:0 "「有个记者——显然就是后来的李维诺夫，他根本不懂格鲁吉亚语——自国外报道，说梯弗里斯出现了一本小册子，『造成了轰动』。」\n\n—— 托洛茨基《斯大林评传》中译本"
 hof_ic_litvinov_the_prisoner_exchange_agreement:0 "战俘交换协议"
 hof_ic_litvinov_the_prisoner_exchange_agreement_desc:0 "「主要的是，这类报导应该寄给沃罗夫斯基和李维诺夫。这可以通过契切林办。」\n\n—— 列宁 / 托洛茨基电报（中文版文集）"
 hof_ic_litvinov_the_litvinov_protocol:0 "李维诺夫议定书"
 hof_ic_litvinov_the_litvinov_protocol_desc:0 "1928 年的凯洛格-白里安公约把放弃战争写进了纸面，签署国却迟迟不批准。1929 年 2 月，苏联、波兰、罗马尼亚、拉脱维亚、爱沙尼亚先在莫斯科互相承诺遵守它 —— 这就是《李维诺夫议定书》。"
 hof_ic_litvinov_the_definition_of_aggression:0 "侵略的定义"
 hof_ic_litvinov_the_definition_of_aggression_desc:0 "1933 年 2 月 6 日，法国代表保罗-邦库尔问他：全面裁军之后，小国难道不更危险吗？他反问：「小国在强大邻国裁军之后，会比现在更不安全吗？」"
 hof_ic_litvinov_the_franco_soviet_treaty:0 "苏法互助条约"
 hof_ic_litvinov_the_franco_soviet_treaty_desc:0 "1933 年 11 月，他在华盛顿谈成了美苏建交。1935 年 5 月，他与法国签下互助条约；同月又与捷克斯洛伐克签了一份 —— 但捷克的那一份附着一句话：只有法国先履行援助，捷克才有义务援助。"
 hof_ic_litvinov_the_advisor_to_the_commissariat:0 "外交人民委员会顾问"
 hof_ic_litvinov_the_advisor_to_the_commissariat_desc:0 "1939 年 5 月之后，他名下写的职务是「外交人民委员会顾问」。两年后德国打了进来，他被重新派了出去 —— 这一次是驻美特命全权大使。"

 # ---------------------------------------------------------------------------
 # 索柯里尼柯夫个人线 6 条国策（文案为史实/理论节选，来源见 docs/68 §2 / §5）
 # ---------------------------------------------------------------------------
 hof_ic_sokolnikov_the_nationalisation_of_the_banks:0 "银行国有化"
 hof_ic_sokolnikov_the_nationalisation_of_the_banks_desc:0 "十月革命之后，他先做的不是打仗，是把银行拿到手里 —— 接管俄国的银行，并把它们并成一套集中的银行体系。"
 hof_ic_sokolnikov_the_turkestan_rouble:0 "突厥卢布"
 hof_ic_sokolnikov_the_turkestan_rouble_desc:0 "1920 年他去了突厥斯坦。在当地，贬得几乎不值钱的纸币叫突厥卢布；他把它们换成了全苏货币。同一年，那里的余粮收集制也先一步取消了 —— 比全国早。"
 hof_ic_sokolnikov_the_chervonets:0 "切尔沃涅茨"
 hof_ic_sokolnikov_the_chervonets_desc:0 "1922 年 11 月，国家银行开始发行切尔沃涅茨：它法定等于十卢布的沙皇金币；四分之一由金、贵金属与外汇保证，四分之三由易售的商品与短期债券保证。「这世上没有什么是永久的，纸币的价值尤其不是。」\n\n—— 索柯里尼柯夫《俄国的物价下跌》"
 hof_ic_sokolnikov_what_a_dollar_costs:0 "一美元值多少"
 hof_ic_sokolnikov_what_a_dollar_costs_desc:0 "1923 年 1 月，他把两个交易所的数字排在同一张表上：一美元在柏林值多少马克、在莫斯科的自由交易所值多少卢布。结论是：马克贬值的速度是卢布的 2 倍半。「那些做纸币生意的国家，拒绝承认俄国纸币是它们家族的一员……正如欧洲各国政府拒绝『承认』苏维埃政府是一个政府。」\n\n—— 索柯里尼柯夫《俄国卢布与德国马克》"
 hof_ic_sokolnikov_state_capitalism:0 "国家资本主义"
 hof_ic_sokolnikov_state_capitalism_desc:0 "「即使在私有财产原则占主导的国家，私营企业的无限竞争也在稳步退却，让位于巨大的金融和工业公司……在这种条件下，国家的不干涉政策将意味着国家权力的瘫痪。」\n\n—— 索柯里尼柯夫，1928 年"
 hof_ic_sokolnikov_hard_currency:0 "硬通货"
 hof_ic_sokolnikov_hard_currency_desc:0 "「他完成了交给他的每一项任务 —— 例如创造了第一个稳定的苏联货币。」\n\n—— 巴扎诺夫这样记下他"

 # ---------------------------------------------------------------------------
 # 图哈切夫斯基个人线 9 条国策（文案为史实/理论节选，来源见 docs/71 §2 / §5）
 # ---------------------------------------------------------------------------
 hof_ic_tukhachevsky_the_military_academy:0 "军事学院"
 hof_ic_tukhachevsky_the_military_academy_desc:0 "1921 年 8 月 27 日，他担任由总参谋学院改名而来的工农红军军事学院院长。"
 hof_ic_tukhachevsky_the_regular_army:0 "正规军"
 hof_ic_tukhachevsky_the_regular_army_desc:0 "1930 年 1 月，他提出部队改革的建议：不仅涉及武器现代化，还提出要重组军队 —— 反对民兵制，要求建立一支正规军；并要求增加战车和飞机的产量、削减骑兵单位。"
 hof_ic_tukhachevsky_airborne_and_tanks:0 "空降兵与战车"
 hof_ic_tukhachevsky_airborne_and_tanks_desc:0 "他于 1931 年组建了世界上第一支伞兵部队；战车依任务被划分为直接支援步兵、远程支援与远程突击三类编组，分別配备轻型、中重型与高速战车。"
 hof_ic_tukhachevsky_the_deep_battle_instructions:0 "纵深战斗指示"
 hof_ic_tukhachevsky_the_deep_battle_instructions_desc:0 "相关规范历经 1933 年的《纵深战斗组织临时指示》与 1935 年的《纵深战斗指示》，先在部队里逐次试行、修正。"
 hof_ic_tukhachevsky_the_four_echelons:0 "四个梯次"
 hof_ic_tukhachevsky_the_four_echelons_desc:0 "进攻须以四个梯次同时打击敌军纵深：航空兵首先夺取制空权并轰炸敌阵地；由战车、步兵与火炮组成的诸兵种合成突击集群突破敌军防线；机械化部队随即向纵深扩张战果、包围敌军与后方要地；预备队则负责巩固所得。"
 hof_ic_tukhachevsky_the_defence_of_the_union:0 "联盟国防"
 hof_ic_tukhachevsky_the_defence_of_the_union_desc:0 "1926 年 12 月 26 日，他在报告《苏维埃社会主义共和国联盟的国防》里写道：我们贫乏的物质作战动员储备只够战争的第一阶段；只有武装力量、铁路运输和工业都具备高动员准备度，工农红军才能完成苏联的国防任务；无论是红军还是国家，都没有为战争做好准备。"
 hof_ic_tukhachevsky_military_economic_mobilization:0 "军事经济动员"
 hof_ic_tukhachevsky_military_economic_mobilization_desc:0 "他主张，红军的规模应依工业化后的「生产可能性」重新估算，而非沿用传统的逐年递增方式；他从汽车与拖拉机的产能推算，认为苏联战时每年可生产约四万架飞机与十万辆战车，并据此构想一支拥有二百六十个师、四万架作战飞机与五万辆作战战车的庞大军队。"
 hof_ic_tukhachevsky_air_mechanization:0 "空中机械化"
 hof_ic_tukhachevsky_air_mechanization_desc:0 "他受恩格斯影响，主张未来战争将是动员国家全部经济与政治资源的大规模战争，并提出「空中机械化」的构想，即把航空、战车、无线电与化学战整合为一体；他要求完全以新的方式对待整个武器系统、组织、战术和部队训练的规划。"
 hof_ic_tukhachevsky_the_field_regulations:0 "工农红军野战条令"
 hof_ic_tukhachevsky_the_field_regulations_desc:0 "1936 年的《工农红军野战条令》把前几年试行过的东西写成了全年的令；其宗旨被概括为：使敌人「在其部署的全纵深遭到歼灭、包围并歼灭」。"

 # ---------------------------------------------------------------------------
 # 沃兹涅先斯基个人线 6 条国策（文案为史实/理论节选，来源见 docs/74 §2 / §5）
 # ---------------------------------------------------------------------------
 hof_ic_voznesensky_the_fight_for_the_plan:0 "为实现当前阶段的计划而斗争"
 hof_ic_voznesensky_the_fight_for_the_plan_desc:0 "在新经济政策的最后阶段和社会主义时期的最初阶段的现时期，计划的作用异乎寻常地增大了。……如果说价值规律是商品资本主义生产的运动规律，那末社会主义计划则是苏维埃经济的发展规律。\n\n—— 沃兹涅先斯基《为实现当前阶段的计划而斗争》，《真理报》1931 年 10 月 8 日"
 hof_ic_voznesensky_the_leningrad_plan:0 "列宁格勒计划委员会"
 hof_ic_voznesensky_the_leningrad_plan_desc:0 "1935 年至 1937 年，他是列宁格勒市计划委员会主席，兼任列宁格勒市苏维埃执行委员会副主席。这是他第一次亲手做一张表。"
 hof_ic_voznesensky_the_state_planning_committee:0 "国家计划委员会"
 hof_ic_voznesensky_the_state_planning_committee_desc:0 "1938 年 1 月 19 日起，他是苏联国家计划委员会主席（1942 年 12 月 8 日再任）。在这个位子上，他「承担了政府里的主要部分工作」。\n\n—— 历史学博士奥·赫列夫纽克"
 hof_ic_voznesensky_the_placement_of_plants:0 "安置疏散企业"
 hof_ic_voznesensky_the_placement_of_plants_desc:0 "1941 年 8 月 7 日，国防委员会第 421 号决议《关于安置被疏散企业的程序》把保障工业疏散与动员的任务交给国家计划委员会；各人民委员部必须与它协商，确定工厂的最终落脚点，并组织重复生产。「与基本工业设备一起，工人和工程技术人员被转移到国家的东部地区，而这些地区新生产能力的建设被全力加速。」\n\n—— 沃兹涅先斯基《苏联战时经济》"
 hof_ic_voznesensky_the_ammunition_plan:0 "弹药生产计划"
 hof_ic_voznesensky_the_ammunition_plan_desc:0 "他被任命为国防委员会负责「工业完成弹药生产计划」的全权代表。1943 年，122 毫米炮弹的产量比 1942 年增加了 90%，82 毫米迫击炮弹增加了 81%，152 毫米炮弹增加了 60%。\n\n—— 沃兹涅先斯基《苏联战时经济》"
 hof_ic_voznesensky_the_war_economy:0 "卫国战争的政治经济学"
 hof_ic_voznesensky_the_war_economy_desc:0 "「1941–1945 年的伟大卫国战争使苏联国民经济发生了根本变化；它改造了苏联经济以保证战争的胜利，并产生了战时特有的经济规律。这个时期在苏联历史上成为社会主义经济的一个特殊时期 —— 战时经济时期，并构成社会主义政治经济学中一个专门篇章 —— 卫国战争的政治经济学 —— 的主题。」\n\n—— 沃兹涅先斯基《苏联战时经济》引言（中译本名《卫国战争期内的苏联战时经济》，外国文书籍出版社，1948）"

 # ---------------------------------------------------------------------------
 # 彼得·斯米尔诺夫个人线 6 条国策（文案为史实/理论节选，来源见 docs/77 §2 / §5）
 # ---------------------------------------------------------------------------
 hof_ic_pyotr_smirnov_the_naval_directorate:0 "工农红军海军局"
 hof_ic_pyotr_smirnov_the_naval_directorate_desc:0 "1926 年的苏联海军，指挥归陆海军人民委员部；在部里，它设的只是「苏联海军局」—— 同一年改称「工农红军海军局」。\n\n—— 中文维基〈苏联海军〉"
 hof_ic_pyotr_smirnov_the_general_staff:0 "海军总参谋部"
 hof_ic_pyotr_smirnov_the_general_staff_desc:0 "中央执行委员会与人民委员会决议：一、成立全联盟的海军人民委员部。同一天，舰队的作战指挥机关「海军总参谋部」也随之成立。\n\n—— 1937 年 12 月 30 日苏联中央执行委员会与人民委员会决议 / 中文维基〈苏联海军〉"
 hof_ic_pyotr_smirnov_the_naval_aviation:0 "海军航空兵"
 hof_ic_pyotr_smirnov_the_naval_aviation_desc:0 "1938 年 1 月 1 日，海军航空兵脱离空军建制，并入海军。\n\n—— 中文维基〈苏联海军〉"
 hof_ic_pyotr_smirnov_the_declaration:0 "建军宣示"
 hof_ic_pyotr_smirnov_the_declaration_desc:0 "1938 年 2 月 3 日，海军人民委员斯米尔诺夫在《真理报》上公开了建设远洋海军的思想：在第三个五年计划期间造出苏联第一批战列舰，还要建造重型巡洋舰、巡洋舰、驱逐舰、潜艇等。\n\n—— 中文维基〈苏联海军〉"
 hof_ic_pyotr_smirnov_the_military_council:0 "海军军事委员会"
 hof_ic_pyotr_smirnov_the_military_council_desc:0 "1938 年 4 月 23 日，海军人民委员部下设海军总军事委员会，主席是 П. А. 斯米尔诺夫，成员包括加列尔、日丹诺夫、伊萨科夫、库兹涅佐夫、列夫琴科。\n\n—— 俄文维基〈苏联海军人民委员部〉（本项目转译）"
 hof_ic_pyotr_smirnov_the_commissariat:0 "海军人民委员部"
 hof_ic_pyotr_smirnov_the_commissariat_desc:0 "中央执行委员会与人民委员会决议：一、成立全联盟的海军人民委员部。二、把工农红军的海军力量移交海军人民委员部，把它们从苏联国防人民委员部里分出来。三、海军人民委员须在五日内向人民委员会提交该部的条例草案与编制。\n\n—— 主席 М. 加里宁，人民委员会主席 В. 莫洛托夫，秘书 А. 戈尔金。// 1937 年 12 月 30 日苏联中央执行委员会与人民委员会决议（载《苏维埃西伯利亚报》1938 年 1 月 1 日第 1(5469) 号第 1 版；本项目据俄文原文转译）"

 # ---------------------------------------------------------------------------
 # 马林科夫个人线 6 条国策（文案为史实/理论节选，来源见 docs/80 §2 / §5）
 # ---------------------------------------------------------------------------
 hof_ic_malenkow_the_party_card_index:0 "党员登记卡"
 hof_ic_malenkow_the_party_card_index_desc:0 "1935 至 1936 年，党在全国范围内检查并交换党证。这场运动为全体党员与预备党员建立了登记卡与档案，总数约二百五十万份；连同对非党领导人与专家的资料，它后来成了一整套干部名册的底座。\n\n—— 俄文维基〈Маленков〉（本项目据俄文转译）"
 hof_ic_malenkow_the_cadres_directorate:0 "中央干部管理局"
 hof_ic_malenkow_the_cadres_directorate_desc:0 "一个庞大的、中央集权的干部名册体系就这样建成了 —— 它成了马林科夫的主要党内专业。\n\n—— 俄文维基〈Маленков〉（本项目据俄文转译）"
 hof_ic_malenkow_the_state_defence_committee:0 "国防委员会"
 hof_ic_malenkow_the_state_defence_committee_desc:0 "1941 年 6 月 30 日成立的国防委员会只有五个人，其中一个是他。他在这个小组里管的是人：督导近卫迫击炮部队的组建，随后主持雷达与火箭两个特别委员会。他后来说：「党在极短的时间内，把整个国家的经济生活置于战时轨道，把一切经济活动服从于『一切为了前线』这个口号。」\n\n—— 马林科夫 1947 年 9 月在共产党情报局会议上的报告（据 MIA 英文本转译）"
 hof_ic_malenkow_the_aviation_affair:0 "航空案"
 hof_ic_malenkow_the_aviation_affair_desc:0 "「马林科夫同志，作为航空工业与空军验收的负责人，对在这些部门工作中暴露出来的丑恶现象（出产劣质飞机）负有道德责任 —— 他明知这些丑恶现象，却未向中央报告。」1946 年 5 月 4 日，联共（布）中央政治局据此把他撤出中央书记处。九天后，他被任命为第二号特别委员会主席，去管火箭。\n\n—— 1946-05-04 联共（布）中央政治局决议（俄文维基〈Маленков〉引；本项目据俄文转译）"
 hof_ic_malenkow_the_party_schools:0 "党校"
 hof_ic_malenkow_the_party_schools_desc:0 "「在各省与各边疆区，组织了 177 所两年制党校与九个月的学习班，学员总数约三万人；中央委员会设立了社会科学院。」\n\n—— 马林科夫 1947 年 9 月在共产党情报局会议上的报告（据 MIA 英文本转译）"
 hof_ic_malenkow_the_premiership:0 "部长会议主席"
 hof_ic_malenkow_the_premiership_desc:0 "1953 年 3 月 5 日，他接任苏联部长会议主席 —— 坐进了那个位子。而他带进去的东西是同一件：一套从 1935 年起就写着「谁可以用」的干部名册（官册，номенклатура）。这套名册比它的任何一位主人活得都久。\n\n—— 中文维基〈马林科夫〉 · 俄文维基〈Маленков〉（本项目转译）"

 # ---------------------------------------------------------------------------
 # 赫鲁晓夫个人线 6 条国策（文案为史实/理论节选，来源见 docs/83 §2 / §4）
 # ---------------------------------------------------------------------------
 hof_ic_khrushchev_the_workers_faculty:0 "工人速成中学"
 hof_ic_khrushchev_the_workers_faculty_desc:0 "1921 年底，他进了顿河工业学校附属的工人速成中学，并被选为那里的党组织书记 —— 而此前他已经是鲁奇琴科沃矿的副矿长。一个已经管着一个矿的人回到课桌前：他知道位子不等于会算。\n\n—— 俄文维基〈Хрущёв〉（本项目据俄文转译）"
 hof_ic_khrushchev_the_obligatory_deliveries:0 "义务交售制"
 hof_ic_khrushchev_the_obligatory_deliveries_desc:0 "1946 年 10 月 15 日，他写信要求减少谷物上缴的配额；12 月又建议发放供应卡，以保障农村人口有最低的食物保障 —— 遭到怒骂。他撞的不是某一个人，而是那个把粮食从共和国手里拿走的制度本身。\n\n—— 中文维基〈赫鲁晓夫〉"
 hof_ic_khrushchev_the_agro_towns:0 "农业城市"
 hof_ic_khrushchev_the_agro_towns_desc:0 "为了实现他「消灭城乡差别」的理想，他还试图将集体农场合并为农业城市；他建立一个样板点，并于 1949 年 10 月把它作为七十岁寿辰的礼物献上。1951 年 3 月 4 日，《真理报》上他关于农业城市化的讲话稿整整占据两个版面 —— 但报纸随即修正了观点；4 月的莫斯科党的全体会议上，众人纷纷对他大加鞭挞。\n\n—— 中文维基〈赫鲁晓夫〉"
 hof_ic_khrushchev_the_purchase_prices:0 "收购价"
 hof_ic_khrushchev_the_purchase_prices_desc:0 "1953 至 1956 年间，国家对集体农庄产品的收购价提高了三倍 —— 让种地的人先拿到钱，是「往下交」的第一步。这一版方案由马林科夫在 1953 年 8 月先行提出，他在 9 月提出了更高的数字。\n\n—— 俄文维基〈Хрущёв〉 · 中文维基〈赫鲁晓夫〉（本项目据俄文转译）"
 hof_ic_khrushchev_the_virgin_lands:0 "荒地"
 hof_ic_khrushchev_the_virgin_lands_desc:0 "1954 年 2 月，党中央全会通过决议，决定在哈萨克和西伯利亚大规模开垦荒地。从 1954 年到 1958 年，政府为开荒投资 67 亿卢布，动员数十万志愿者到东部地区落户，共开垦出 4000 万公顷的土地。1958 年苏联农业丰收，垦荒区共收获谷物 5850 万吨，占当年全苏粮食总产量的 40％ 以上。\n\n—— 中文维基〈赫鲁晓夫〉"
 hof_ic_khrushchev_the_economic_councils:0 "国民经济委员会"
 hof_ic_khrushchev_the_economic_councils_desc:0 "撤销部门性部委，成立国民经济委员会（1957）。他陆续把 1.5 万个中央直属企业下放到加盟共和国管理，同时扩大加盟共和国的管理权限 —— 他把这些工厂交给了它们所在的那一级。这项改革没有从根本上改变国家管理企业的行政办法，也滋生地方本位主义等问题。—— 俄文维基〈Хрущёв〉「主要政治举措」节（本项目据俄文转译） · 中文维基〈赫鲁晓夫〉"

 # ---------------------------------------------------------------------------
 # 伏罗希洛夫个人线 6 条国策（文案为史实/理论节选，来源见 docs/87 §2 / §4）
 # ---------------------------------------------------------------------------
 hof_ic_voroshilov_the_red_army_commanders:0 "工农红军指挥员"
 hof_ic_voroshilov_the_red_army_commanders_desc:0 "「我们应当已经可以自豪地说，这项建立一支能够管理我们红军的指挥干部队伍的、极其巨大而艰巨的任务，我们已经完成了 75%。在 48 000 名红指挥员中，我们有 34 000 多名毕业于我们的正规学校或短期训练班。」\n\n—— 1926 年 9 月 10 日红指挥员毕业典礼上的讲话。到 1928 年初，红军手里有 49 所军事学校和 6 所军事学院、5 个军事系。"
 hof_ic_voroshilov_the_marksmanship_badge:0 "伏罗希洛夫射手"
 hof_ic_voroshilov_the_marksmanship_badge_desc:0 "1932 年 12 月 29 日，批准 Осоавиахим 的「伏罗希洛夫射手」胸章，用于奖赏射击准确的人。一枚胸章就是一套考核：它把枪法变成了每一个青年都能去考的东西。\n\n—— 俄文维基〈Ворошилов〉（本项目据俄文转译）"
 hof_ic_voroshilov_the_ranks:0 "个人军衔制"
 hof_ic_voroshilov_the_ranks_desc:0 "「设立『苏联元帅』这一军衔，由苏联政府个人授予最高指挥人员中杰出的、特别功勋卓著的人员。」\n\n—— 苏联中央执行委员会与人民委员会 1935 年 9 月 22 日第 19/2135 号决议。1935 年 11 月 20 日首次授予，五人获得：国防人民委员伏罗希洛夫、总参谋长叶戈罗夫、国防副人民委员图哈切夫斯基、骑兵监察员布琼尼、远东特别红旗集团军司令布柳赫尔。"
 hof_ic_voroshilov_the_partisan_staff:0 "中央游击运动总参谋部"
 hof_ic_voroshilov_the_partisan_staff_desc:0 "「由于他的威望、精力和坚持，游击运动的许多重要问题得到了解决，特别是在战斗与物资技术供应以及为游击队进行空运方面。」\n\n—— 潘捷列伊蒙·波诺马连科。1942 年 9 月 6 日他出任游击运动总司令，把指挥体系改成一套沿用至战争结束的做法：中央游击运动总参谋部变成一个强大的机关。"
 hof_ic_voroshilov_war_trophies_regulation:0 "战利品机关条例"
 hof_ic_voroshilov_war_trophies_regulation_desc:0 "「红军的战利品机关、部队与机构保证收集、保管、清点、运出与交出从敌人手中缴获的战利品武器装备、弹药、战斗技术装备、粮秣、油料以及其他军事与国民经济物资。」\n\n—— 1944 年 4 月 3 日《红军战利品机关、部队与机构条例》。他自 1943 年 4 月起任战利品委员会主席。"
 hof_ic_voroshilov_the_allied_control_commission:0 "盟国管制委员会"
 hof_ic_voroshilov_the_allied_control_commission_desc:0 "1945 年 2 月 5 日，盟国管制委员会在德布勒森开始工作。它的职责是管制并监督停战条件的执行。1945 至 1947 年间，他任驻匈牙利的盟国管制委员会主席，直到和约生效后委员会才停止活动。\n\n—— 俄文维基〈Ворошилов〉（本项目据俄文转译）"

