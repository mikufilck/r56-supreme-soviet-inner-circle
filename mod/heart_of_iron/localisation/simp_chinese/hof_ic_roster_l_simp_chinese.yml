 hof_ic_seat_lev_trotsky_desc:0 "一位能干的军事组织者在最高苏维埃中占有一席之地。列夫·托洛茨基不仅缔造了红军，还是革命的老近卫；邀请他加入最高苏维埃，风险不大而收益却很可观。"
 hof_ic_seat_nikolay_bukharin_desc:0 "作为一名党的理论家，尼古拉·布哈林拥有为政策提供依据所必需的才能。若是邀请他加入最高苏维埃，我们一方面将受益于他手中的那支笔，另一方面也能安抚那些对现行路线心存疑虑的党员。"
 hof_ic_seat_aleksey_rykov_desc:0 "作为一名经验丰富的行政官员，阿列克谢·李可夫已经证明自己能维持国家机器的运转。如果邀请他加入最高苏维埃，我们相信他能对[ROOT.GetNameDef]的经济恢复发挥很大作用。"
 hof_ic_seat_grigory_zinovyev_desc:0 "最高苏维埃始终欢迎那些能够掌握党的机关的人。作为共产国际的第一位主席，邀请格里戈里·季诺维也夫加入最高苏维埃，对我们来说将是非常有利的。"
 hof_ic_seat_lev_kamenev_desc:0 "作为一名善于调停的人，列夫·加米涅夫在党的各派之间都说得上话。若是邀请他加入最高苏维埃，我们一方面将受益于他的斡旋，另一方面也能借此平息党内的争执。"
 hof_ic_seat_ivan_smirnov_desc:0 "作为一名在内战中成长起来的老布尔什维克，伊万·斯米尔诺夫既能带兵，也能办党务。如果邀请他加入最高苏维埃，我们相信他能在军中发挥很大作用。"
 hof_ic_seat_leonid_serebryakov_desc:0 "作为一名党务工作者，列昂尼德·谢列布里亚科夫熟悉党的组织机器。若是邀请他加入最高苏维埃，我们一方面将受益于他对基层的掌握，另一方面也能借此稳住地方组织。"
 hof_ic_seat_yevgeny_preobrazhensky_desc:0 "作为一名经济学家，叶夫根尼·普列奥布拉任斯基为加速工业化提供了理论依据。若是邀请他加入最高苏维埃，我们一方面将受益于他关于积累的论证，另一方面也能让那些要求加快工业化的党员看到方向。"
 hof_ic_seat_karl_radek_desc:0 "最高苏维埃始终欢迎那些在外交场合说得上话的人。作为共产国际的早期领导人和布列斯特谈判的代表，邀请卡尔·拉狄克加入最高苏维埃，对我们来说将是非常有利的。"
 hof_ic_seat_ivar_smilga_desc:0 "作为一名拉脱维亚裔的经济学家，伊瓦尔·斯米尔加熟悉国民经济的管理与核算。如果邀请他加入最高苏维埃，我们相信他能在经济事务上发挥很大作用。"
 hof_ic_seat_mikhail_tomsky_desc:0 "一位从车床旁走出来的人，在最高苏维埃中自有他的位置。米哈伊尔·托姆斯基不仅领导着全苏工会，还是政治局的老成员；邀请他加入最高苏维埃，风险不大而收益却很可观。"
 hof_ic_seat_martemyan_ryutin_desc:0 "作为一名敢于把主张写成文件的人，马尔特米扬·里亚京在地方党组织中很有影响。若是邀请他加入最高苏维埃，我们一方面将受益于他与农村的联系，另一方面也要准备好听取他的批评。"
 hof_ic_seat_aleksandr_shlyapnikov_desc:0 "作为一名金属工人，亚历山大·施利亚普尼科夫在车间里说话有分量。如果邀请他加入最高苏维埃，我们相信他能把工人的声音带进来。"
 hof_ic_seat_mikhail_kalinin_desc:0 "作为从十月革命起就担任国家元首的人，米哈伊尔·加里宁在农民中享有声望。若是邀请他加入最高苏维埃，我们一方面将受益于他的资历，另一方面也能借此安抚农村。"
 hof_ic_seat_maksim_litvinov_desc:0 "作为一名职业外交官，马克西姆·李维诺夫熟悉与西方打交道的分寸。如果邀请他加入最高苏维埃，我们相信他能在国际事务上发挥很大作用。"
 hof_ic_seat_grigory_sokolnikov_desc:0 "作为一名财政专家，格里戈里·索柯里尼柯夫曾经稳住过我国的货币。若是邀请他加入最高苏维埃，我们一方面将受益于他对财政的把握，另一方面也能借此收敛开支。"
 hof_ic_seat_mikhail_tukhachevsky_desc:0 "一位主张把红军机械化的元帅，在最高苏维埃中占有一席之地。米哈伊尔·图哈切夫斯基不仅打过内战，还设计了未来的作战方式；邀请他加入最高苏维埃，风险不大而收益却很可观。"
 hof_ic_seat_nikolay_voznesensky_desc:0 "作为一名计划工作者，尼古拉·沃兹涅先斯基熟悉国家的账本与产能。如果邀请他加入最高苏维埃，我们相信他能在工业规划上发挥很大作用。"
 hof_ic_seat_pyotr_smirnov_desc:0 "作为一名政治委员，彼得·斯米尔诺夫既懂政治工作，也熟悉舰队。若是邀请他加入最高苏维埃，我们一方面将受益于他的军事经验，另一方面也能借此加强对海军的掌握。"
 hof_ic_seat_georgy_malenkow_desc:0 "一名熟悉党的档案与人事的人，在任何领导机构里都用得上。格奥尔基·马林科夫长年在组织局主持干部工作；邀请他加入最高苏维埃，对我们来说将是非常有利的。"
 hof_ic_seat_nikita_khrushchyov_desc:0 "作为一名工人出身、又在乌克兰主持过一方的干部，尼基塔·赫鲁晓夫熟悉基层。如果邀请他加入最高苏维埃，我们相信他能在地方事务上发挥很大作用。"
 hof_ic_seat_kliment_voroshilov_desc:0 "一位老布尔什维克和内战英雄，在最高苏维埃中占有一席之地。克利门特·伏罗希洛夫不仅与斯大林共过患难，还长期主持军事人民委员部；邀请他加入最高苏维埃，风险不大而收益却很可观。"

