 # ── 分类（决议面板里的页签） ──
 hof_sov_integrate_category:0 "整合加盟共和国"
 hof_sov_integrate_category_desc:0 "把已经成为苏联附庸、并且已经建立共产主义政权的国家正式并入联盟。\n\n完成「宣称波罗的海」国策后启用。"

 # ── ① 波罗的海三国（各 15 天） ──
 hof_sov_integrate_estonia:0 "整合爱沙尼亚加盟共和国"
 hof_sov_integrate_estonia_desc:0 "爱沙尼亚在成为苏联附庸并转为共产主义政体后，可以启动整合程序。\n\n程序持续 §Y15 天§!；完成时：该国所有科学家、以及不带「反布尔什维克老兵」特质的陆军与海军将领转入苏联，该国随后被苏联吞并。"

