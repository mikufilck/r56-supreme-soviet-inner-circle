l_simp_chinese:
 hof_ic_cinema_category:0 "苏联电影巡映"
 hof_ic_cinema_category_desc:0 "把联盟电影公司的影片送到全国银幕。每部影片只能组织一次全国巡映。"
 hof_ic_screen_be_like_them:0 "巡映《像他们那样》"
 hof_ic_screen_be_like_them_desc:0 "1930 年影片《像他们那样》（Будьте такими，亦称《Р.В.С.》）改编自盖达尔的内战故事：一名逃出白军囚禁的布尔什维克在乡村得到援助。"
 hof_ic_screen_remember_their_faces:0 "巡映《记住他们的面孔》"
 hof_ic_screen_remember_their_faces_desc:0 "1930 年影片《记住他们的面孔》（Запомните их лица）以制革厂工人的发明和针对他的反犹太煽动为中心。"
 hof_ic_screen_counterplan:0 "巡映《迎击计划》"
 hof_ic_screen_counterplan_desc:0 "1932 年影片《迎击计划》（Встречный）描写列宁格勒工人为完成超额生产计划而协力制造汽轮机。"
 hof_ic_cinema_counterplan:0 "《迎击计划》全国巡映"
 hof_ic_cinema_counterplan_desc:0 "重映工人超额生产的影片，持续 180 天。"
