 # 需求 C：经互会通用线（S5）—— 由 build/gen-hof-ma-common-lines.ps1 生成，勿手改
 # 设计见 docs/un-focus/01，数值见 docs/un-focus/02。

 # ---------- 三个动态民族精神 ----------
 hof_ma_dm_eco:0 "经济互助委员会"
 hof_ma_dm_eco_desc:0 "经互会成员国之间协调计划、分工生产、互换能源与原料。这条线每完成一个国策，下列数值就累积一层。"
 hof_ma_dm_pol:0 "共产党和工人党情报局"
 hof_ma_dm_pol_desc:0 "从情报局到群众组织、再到第一书记会议：党际协调的每一层。这条线每完成一个国策，下列数值就累积一层。"
 hof_ma_dm_mil:0 "华沙条约组织"
 hof_ma_dm_mil_desc:0 "从条约本体到联合司令部、统一制式、防空与核部署。这条线每完成一个国策，下列数值就累积一层。"

 # ---------- 机构 idea ----------
 hof_ma_idea_comecon:0 "经济互助委员会"
 hof_ma_idea_comecon_desc:0 "成员国按协调过的计划分工生产，同类产品的产线向一两个国家集中。"
 hof_ma_idea_division_of_labour:0 "国际社会主义分工表"
 hof_ma_idea_division_of_labour_desc:0 "哪一国造什么、造多少，写在一张表上；计划合作委员会照着它核对。"
 hof_ma_idea_integration_programme:0 "社会主义经济一体化纲要"
 hof_ma_idea_integration_programme_desc:0 "一体化自此成为正式用语：生产、科技、贸易、货币各自有分册。"
 hof_ma_idea_joint_research_org:0 "联合研究组织"
 hof_ma_idea_joint_research_org_desc:0 "标准化研究所与三个研究所把成员国的标准、情报与文献并成一套。"
 hof_ma_idea_cominform:0 "共产党和工人党情报局"
 hof_ma_idea_cominform_desc:0 "九国党的常设联络机关：交换情报，也交换口径。"
 hof_ma_idea_cominform_press:0 "《争取持久和平，争取人民民主！》"
 hof_ma_idea_cominform_press_desc:0 "情报局的机关报，用多种文字同时出版，直送各党基层。"
 hof_ma_idea_wpc:0 "世界和平理事会"
 hof_ma_idea_wpc_desc:0 "以斯德哥尔摩呼吁为起点，把和平做成一个可以长期签名的机构。"
 hof_ma_idea_oir:0 "国际广播组织"
 hof_ma_idea_oir_desc:0 "节目交换与技术标准：唯一不需要对方政府同意就能抵达的那一层。"
 hof_ma_idea_friendship_societies:0 "对外友好与文化联络协会"
 hof_ma_idea_friendship_societies_desc:0 "各国「苏友协」的网络，接替 1925 年的 ВОКС；往来不必都走外交部。"
 hof_ma_idea_first_secretaries:0 "第一书记与政府首脑会议"
 hof_ma_idea_first_secretaries_desc:0 "章程上找不到、机构表上没有，但所有真正的决定都在这里做出。"
 hof_ma_idea_warsaw_treaty:0 "华沙条约组织"
 hof_ma_idea_warsaw_treaty_desc:0 "《友好合作互助条约组织》：八国承诺共同防御任何受到攻击的成员。"
 hof_ma_idea_joint_command:0 "联合武装部队司令部"
 hof_ma_idea_joint_command_desc:0 "各国派一名将军常驻，总指挥部在华沙、军事总部在莫斯科。"
 hof_ma_idea_csce:0 "赫尔辛基最后文件"
 hof_ma_idea_csce_desc:0 "1975 年 8 月 1 日签署：演习通报与信任措施写进条文。"
 hof_ma_idea_nuclear_umbrella:0 "核保护伞"
 hof_ma_idea_nuclear_umbrella_desc:0 "在成员国的核部署安排加上一份统一的作战计划。"

 # ---------- 好感修正 ----------
 hof_ma_eec_trade_agreement:0 "与经互会直接通商"
 hof_ma_mbfr_detente:0 "维也纳裁军谈判"

 # ---------- 头节点 ----------
 hof_ma_founding:0 "莫洛托夫计划"
 hof_ma_founding_desc:0 "1947 年 7 月起，苏联以《莫洛托夫计划》回应马歇尔计划：与波兰、捷克斯洛伐克、匈牙利、罗马尼亚、保加利亚、南斯拉夫、芬兰、蒙古等国签订一系列双边贸易与互助条约。这项计划最终扩充并发展成为经济互助委员会。—— 记于〈莫洛托夫计划〉〈经济互助委员会〉条，中文维基。"

 # ---------- 经济互助委员会（23 条）----------
 hof_ma_eco_founding:0 "经济互助委员会"
 hof_ma_eco_founding_desc:0 "1949 年 1 月 5 日至 8 日，苏联、保加利亚、匈牙利、波兰、罗马尼亚、捷克斯洛伐克六国政府代表在莫斯科通过会议磋商后，宣布成立经济互助委员会；1 月 25 日发表《关于成立经济互助委员会的公报》。随后阿尔巴尼亚（1949）、东德（1950）、蒙古（1962）、古巴（1972）、越南（1978）分别加入。总部设在莫斯科。—— 记于〈经济互助委员会〉条，中文维基。"
 hof_ma_eco_common_planning_organ:0 "共同的计划经济组织"
 hof_ma_eco_common_planning_organ_desc:0 "经互会成立之初，计划协调推进得很快：方向看起来是各国国民经济计划的协调，但经互会自身没有任何强制权力 —— 所有决定都需一致批准，而且即使批准了，也还要各国政府各自把它转成自己的政策。超国家计划的第一次尝试，就停在「一致批准」这一步之前。—— 记于【en】Comecon 条「Stalin era」，本项目据英文转译。"
 hof_ma_eco_sofia_principle:0 "索非亚原则"
 hof_ma_eco_sofia_principle_desc:0 "1949 年 8 月，经互会在保加利亚的理事会会议通过「索非亚原则」：成员国的技术向其他国家开放，只收一笔名义费用 —— 少到刚好只够付文件的成本。这一条实质上取消了阵营内部的知识产权边界，受益的自然是工业较不发达的那些成员国。—— 记于【en】Comecon 条「Stalin era」，本项目据英文转译。"
 hof_ma_eco_trade_only:0 "便利贸易的实际问题"
 hof_ma_eco_trade_only_desc:0 "1950 年夏，斯大林「似乎让经互会的工作人员措手不及」地把它的运作几乎完全停掉 —— 苏联在国内转向自给自足，在国外转向用「大使馆体系」直接干预别国事务，而不是走「章程途径」。1950 年 11 月，经互会的职权被正式限定为「便利贸易的实际问题」。此后数年，它更像一张双边换货的账桌，而不是一个共同体。—— 记于【en】Comecon 条「Stalin era」，本项目据英文转译。"
 hof_ma_eco_standing_commissions:0 "常设委员会"
 hof_ma_eco_standing_commissions_desc:0 "1956 年起设立首批常设委员会（一说 10 个、一说 8 个），按行业对口；到 1988 年增至化工、有色金属、煤炭、和平利用原子能等 24 个。常设委员会受执行委员会领导，各国可以有选择地参加。—— 记于〈经济互助委员会〉条「组织机构」，中文维基。"
 hof_ma_eco_charter:0 "经互会章程"
 hof_ma_eco_charter_desc:0 "经互会章程于 1959 年签署、1960 年生效（体例上参照 1957 年的罗马条约），确立「主权平等」与「一致同意」两项原则 —— 所有决议案不具法律效力，只要有一个国家认为会损害自身利益就可以拒绝。—— 记于〈经济互助委员会〉条，中文维基。"
 hof_ma_eco_division_of_labour:0 "国际社会主义分工基本原则"
 hof_ma_eco_division_of_labour_desc:0 "1961 年 12 月，理事会会议通过《国际社会主义分工基本原则》：讲的是更紧密的计划协调，以及把同类产品的生产「集中到一两个社会主义国家去」。这一条既是整合，也是此后一切争执的根源。—— 记于【en】Comecon 条「Khrushchev era」，本项目据英文转译。"
 hof_ma_eco_single_planning_organ:0 "共同的单一计划机构"
 hof_ma_eco_single_planning_organ_desc:0 "1962 年 11 月，苏联部长会议主席赫鲁晓夫接着提出设立「共同的单一计划机构」。捷克斯洛伐克、匈牙利、波兰抵制；反对最激烈的是民族主义情绪日益上升的罗马尼亚 —— 它坚决不接受「自己应当专事农业」这个说法。从提议到搁浅，只用了一次理事会。—— 记于【en】Comecon 条「Khrushchev era」，本项目据英文转译。"
 hof_ma_eco_transferable_rouble:0 "转账卢布"
 hof_ma_eco_transferable_rouble_desc:0 "1963 年 10 月 22 日，经互会成员国签订国际结算协定，确立「转账卢布」；各国自 1964 年 1 月 1 日起用它作为国际货币单位。它没有纸币或国库券那种具体形态，只用于成员国之间的非现金结算。它有 0.987412 克纯金的法定含金量 —— 但既不能兑换成资本主义国家的货币，也不能兑换黄金，只能在成员国货币之间转换。—— 记于〈转账卢布〉条，俄文维基，本项目据俄文转译。"
 hof_ma_eco_ibec:0 "国际经济合作银行"
 hof_ma_eco_ibec_desc:0 "国际经济合作银行（МБЭС）1963 年 10 月 22 日由经互会成员国依国际协定设立，是在苏联境内出现的第一个国际银行；创始成员为保加利亚、匈牙利、东德、蒙古、波兰、罗马尼亚、苏联与捷克斯洛伐克。它管的是转账卢布体系下的多边结算 —— 把成员国之间的账从一张张双边清单收进一本共同的账。—— 记于〈国际经济合作银行〉条，俄文维基，本项目据俄文转译。"
 hof_ma_eco_planning_committee:0 "计划合作委员会"
 hof_ma_eco_planning_committee_desc:0 "理事会下设四个委员会，其中最重要的是计划合作委员会：它由各成员国的国家计划委员会主席组成，负责协调各国的国民经济计划，地位仅在会议与执行委员会之后。这一段评语说得很直白 —— 如果它的决定不需要各国政府和党的批准，它就会被当成经互会的超国家计划机关；而它恰恰需要。—— 记于【en】Comecon 条「Other entities」，本项目据英文转译。"
 hof_ma_eco_interested_party:0 "利益相关方原则"
 hof_ma_eco_interested_party_desc:0 "1967 年，经互会采纳「利益相关方原则」：任何国家都可以退出它选定的任何项目，其余成员国照常推进协调。章程（1967 年修订）的原话是「建议和决定不适用于已声明对某一事项无兴趣的国家」—— 从此，无兴趣方没有否决权，只有不参加的权利。换言之，这一条把「否决」换成了「退出」。—— 记于【en】Comecon 条「Brezhnev era」，本项目据英文转译。"
 hof_ma_eco_executive_committee:0 "执行委员会"
 hof_ma_eco_executive_committee_desc:0 "执行委员会由成员国各派一名副总理作为常驻代表组成，一般每季开会一次，会议主席按国名西里尔字母顺序轮流担任、任期一年。1971 与 1974 年两度增设经济部门，权限被提到常设委员会之上。—— 记于〈经济互助委员会〉条「组织机构」，中文维基。"
 hof_ma_eco_iib:0 "国际投资银行"
 hof_ma_eco_iib_desc:0 "国际投资银行（МИБ）的设立协定由创始国 1970 年 7 月 10 日签署，1971 年 1 月 1 日开始运作，总部设在布达佩斯。它在成立时的主要任务，就是为若干成员国共同的投资项目与发展计划提供中长期贷款 —— 也就是把「协调计划」变成「一起出钱建厂」。在「苏联时期」它累计融资的投资项目超过 70 亿欧元。—— 记于〈国际投资银行〉条，俄文维基，本项目据俄文转译。"
 hof_ma_eco_comprehensive_programme:0 "社会主义经济一体化综合纲要"
 hof_ma_eco_comprehensive_programme_desc:0 "1969 年 4 月特别会议提出、1971 年通过《社会主义经济一体化综合纲要》。「一体化」一词自此正式启用，此后经互会的主要活动方式改为发展成员国企业与科研组织之间的联系并建立合营企业。—— 记于〈经济互助委员会〉条「主要活动」，中文维基。"
 hof_ma_eco_long_term_programmes:0 "长期专项合作纲要"
 hof_ma_eco_long_term_programmes_desc:0 "1971 年《社会主义经济一体化综合纲要》通过之后，经互会的主要活动方式改为发展成员国企业与科研组织之间的联系并建立合营企业；实际推进最快的只有石油、电力与其他科技部门。所谓「长期专项合作纲要」，就是把一体化拆成一份份可以逐年核对的清单：能源、原料、机械、运输各自成册 —— 本节点同时接通铁路，因为纲要里的运输一节就是靠跨阵营的轨距与换装站落地的。—— 记于〈经济互助委员会〉条「主要活动」，中文维基；＋【en】Comecon 条，本项目据英文转译。"
 hof_ma_eco_druzhba:0 "友谊输油管道"
 hof_ma_eco_druzhba_desc:0 "「友谊」管道建于 1960 年代，把伏尔加—乌拉尔油气省的原油送到东欧的经互会国家：匈牙利、捷克斯洛伐克、波兰与东德。管线 1960 年 12 月 10 日从阿尔梅季耶夫斯克开工，用了四年建成，1964 年 10 月 15 日举行正式投产仪式；它是世界上最大的一条干线输油系统。也是这个阵营里最结实的一件实物：一根埋在地下的管子，比任何一份议定书都难退出。—— 记于〈友谊输油管道〉条，俄文维基，本项目据俄文转译。"
 hof_ma_eco_power_grid:0 "「和平」联合电网"
 hof_ma_eco_power_grid_desc:0 "在经互会「慢速前进」的那些年里，真正往前走的只有石油、电力与其他科技部门 —— 电网是其中最实的一项：统一调度、互为备用，一方断电、另一方送电。电网比条约先兑现了「一体化」这个词。本节点按用户口径同时给各国首都加煤。—— 记于【en】Comecon 条「Khrushchev era」，本项目据英文转译。"
 hof_ma_eco_icsti:0 "国际科学技术情报中心"
 hof_ma_eco_icsti_desc:0 "在经互会的正式层级之外还有一批「附属机构」，作用是在成员国的对口机关之间建立直接联系。它们分两类：政府间经济组织（层级较高、管的面较宽），以及国际经济组织（更靠近研究、生产、贸易的作业层）。科技情报的统一交换，就落在后一类里。—— 记于【en】Comecon 条「Affiliated agencies」，本项目据英文转译。"
 hof_ma_eco_intermetall:0 "Intermetall"
 hof_ma_eco_intermetall_desc:0 "Intermetall 是经互会「政府间经济组织」里专门管黑色冶金的那一个 —— 英文维基把它与国际经济合作银行、国际投资银行并列为这一类的三个例子（一个管转账卢布，一个管共同项目融资，一个管钢铁）。它让成员国的轧机不再各自为战，而按同一个规格表排产。—— 记于【en】Comecon 条「Affiliated agencies」，本项目据英文转译。"
 hof_ma_eco_standardisation:0 "标准化研究所"
 hof_ma_eco_standardisation_desc:0 "经互会设有三个研究所：世界社会主义体系国际经济问题研究所、标准化研究所、管理问题国际研究所。其中标准化与经济问题两个研究所都设在莫斯科，人员来自各成员国。标准化研究所处理的是各国标准之间的对接 —— 这是「索非亚原则」落到图纸上的那一半。—— 记于〈经济互助委员会〉条「组织机构」，中文维基；＋【en】Comecon 条「Structure」，本项目据英文转译。"
 hof_ma_eco_scientific_progress:0 "科技进步综合纲要"
 hof_ma_eco_scientific_progress_desc:0 "1985 年通过《到 2000 年的科技进步综合纲要》，是戈尔巴乔夫时期对这个体系下的最后一次注。它把希望押在机器人与电子工业上 —— 而经互会的贸易额在世界上仍然只排在欧共体之后。—— 记于〈经济互助委员会〉条，中文维基。"
 hof_ma_eco_eec_talks:0 "与欧共体直接谈贸易协定"
 hof_ma_eco_eec_talks_desc:0 "1988 年 6 月 25 日之前的那一轮自由化，使经互会国家可以直接与欧洲共同体（改名后的欧共体）谈判贸易条约。阵营经济秩序在这里走到终点：从此每一条贸易协定都签给布鲁塞尔，而不是签给莫斯科 —— 英文维基把这一条与「辛纳屈主义」并列为经互会终局的起点。本节点按史实给西欧四国好感修正。—— 记于【en】Comecon 条，本项目据英文转译。"

 # ---------- 共产党和工人党情报局（18 条）----------
 hof_ma_pol_cominform:0 "共产党和工人党情报局"
 hof_ma_pol_cominform_desc:0 "1947 年 9 月 22 日，苏联、保加利亚、罗马尼亚、波兰、匈牙利、捷克斯洛伐克、南斯拉夫、法国、意大利的共产党和工人党在波兰什克拉尔斯卡-波伦巴开会，成立一个类似第三国际的组织，目的是在各共产党之间交换情报信息。与会者包括马林科夫、日丹诺夫、卡德尔、德热拉斯、哥穆尔卡。总部最初设在贝尔格莱德，1948 年迁往布加勒斯特。—— 记于〈共产党和工人党情报局〉条，中文维基。"
 hof_ma_pol_cominform_organ:0 "《争取持久和平，争取人民民主！》"
 hof_ma_pol_cominform_organ_desc:0 "《争取持久和平，争取人民民主！》是情报局的机关报 —— 情报局会议的决议里明确写着，它的任务之一就是「领导这份报纸」。报纸用多种外文出版，1956 年 4 月情报局停止活动时一并停刊。它是这个组织唯一常年运转的部件。—— 记于〈共产党和工人党情报局〉条，俄文维基，本项目据俄文转译。"
 hof_ma_pol_peace_and_war:0 "保卫和平和反对战争制造者的斗争"
 hof_ma_pol_peace_and_war_desc:0 "「和平」这面旗帜最早是情报局自己举起来的：它把世界分成以苏联为首的「爱好和平」进步力量与以美国为首的「好战」资本主义国家两半，并宣示和平「应当成为各共产党全部活动的轴心」，多数西方共产党照此行事。到 1950 年代初，和平运动反过来盖过了情报局本身。—— 记于【en】World Peace Council 条，本项目据英文转译。"
 hof_ma_pol_working_class_unity:0 "工人阶级的统一"
 hof_ma_pol_working_class_unity_desc:0 "情报局的决议给各共产党与工人党定下的任务，是先用一切斗争手段去争取「稳固而持久的和平」，并且把全部活动都从属于这件事。1950 年它通过苏斯洛夫的报告，把这层意思正式写成决议。这就是「团结」这个词在组织层面的含义。—— 记于【en】World Peace Council 条，本项目据英文转译。"
 hof_ma_pol_wftu:0 "世界工会联合会"
 hof_ma_pol_wftu_desc:0 "世界工会联合会 1945 年成立，前身是 1919 年成立的国际工会联合会；创建时有 51 个国家参加第一次代表大会，除美国劳工联合会外一度都是它的会员。1948 年起西方国家工会以它拒绝马歇尔计划为由陆续退出，并于 1949 年 12 月在伦敦另立国际自由工会联合会 —— 冷战时期，它被公认是苏联主导下的国际劳工组织。—— 记于〈世界工会联合会〉条，中文维基。"
 hof_ma_pol_wfdy:0 "世界民主青年联盟"
 hof_ma_pol_wfdy_desc:0 "1945 年 11 月 10 日，世界青年大会在伦敦成立世界民主青年联盟；第一任秘书长亚历山大·谢列平曾是 1943 年解散的青年共产国际的领导人。它管的是比工会更年轻的那一档人，也是世界青年与学生联欢节的主办单位。—— 记于〈世界民主青年联盟〉条，中文维基。"
 hof_ma_pol_ius:0 "国际学生联合会"
 hof_ma_pol_ius_desc:0 "1946 年 8 月 27 日，39 个国家 43 个学生组织的近 300 名代表在布拉格举行第一届学生代表大会，达成「全世界学生团结起来防止法西斯复兴」的共识，决定成立国际学联；总部设在布拉格，是联合国教科文组织的咨询成员。它是这一层组织里唯一与学校打交道的。—— 记于〈国际学生联合会〉条，中文维基。"
 hof_ma_pol_widf:0 "国际民主妇女联合会"
 hof_ma_pol_widf_desc:0 "1945 年 11 月 26 日，第一届世界妇女大会在巴黎举行；12 月 1 日大会结束前通过决议，正式成立国际民主妇女联合会。1949 年 11 月它在莫斯科开会，正式决定每年 6 月 1 日为国际儿童节 —— 它处理的题目比前几个更靠近日常生活，这恰恰是它能在国内起作用的地方。—— 记于〈国际民主妇女联合会〉条，中文维基。"
 hof_ma_pol_wpc:0 "世界和平理事会"
 hof_ma_pol_wpc_desc:0 "世界和平理事会的前身是 1949 年 4 月巴黎—布拉格大会选出的「和平拥护者世界委员会」；1950 年 11 月在华沙召开第二次世界大会，改用「世界和平理事会」这个名字。1950 年 3 月 18 日它发起斯德哥尔摩呼吁，要求绝对禁止核武器 —— 据说在欧洲征集到 5.6 亿个签名。签署与征集签名，从此成为一种长期作业。—— 记于【en】World Peace Council 条，本项目据英文转译。"
 hof_ma_pol_ioj:0 "国际新闻工作者协会"
 hof_ma_pol_ioj_desc:0 "1946 年 6 月，国际新闻工作者协会在丹麦哥本哈根的一次大会上成立，冷战时期总部设在布拉格。它是苏联在 1940 年代末至 1950 年代初发起成立的数十个外围组织之一；美国中央情报局曾称它为「苏联的宣传工具」。它管的是把消息往哪边发。—— 记于〈国际新闻工作者协会〉条，中文维基。"
 hof_ma_pol_oir:0 "国际广播组织"
 hof_ma_pol_oir_desc:0 "国际广播电视组织（OIRT）成立于 1946 年 6 月 28 日，成员包括保加利亚、捷克斯洛伐克、东德、芬兰、匈牙利、波兰、罗马尼亚和苏联等国的广播电视台，常被称作「Intervision」。中国的北京广播电台与北京电视台也曾加入，后因中苏交恶退出。—— 记于〈国际广播电视组织〉条，中文维基。"
 hof_ma_pol_wfsw:0 "世界科学工作者协会"
 hof_ma_pol_wfsw_desc:0 "世界科学工作者协会 1946 年 7 月 20 至 21 日在伦敦成立，由英国科学工作者协会倡议，最初有 14 个国家的 18 个组织参加。首任主席是法国的约里奥-居里 —— 他当时同时担任世界和平理事会主席，一个人领导着两个组织。—— 记于【en】World Federation of Scientific Workers 条，本项目据英文转译。"
 hof_ma_pol_friendship_societies:0 "友好协会体系（ССОД）"
 hof_ma_pol_friendship_societies_desc:0 "苏联对外友好与文化联络协会（ССОД）1958 年由 ВОКС 改组而来。ВОКС 长期被西方政府官员、知识界与媒体批评为事实上的共产主义宣传组织；ССОД 接替它继续运作，直到 1992 年。各国「苏友协」的网络就挂在这一层上 —— 一封协会的邀请函也可以办成外交部要办的往来。—— 记于【en】VOKS 条，本项目据英文转译。"
 hof_ma_pol_moscow_1957:0 "1957 年莫斯科会议"
 hof_ma_pol_moscow_1957_desc:0 "1957 年 11 月 16 至 19 日，64 个共产党和工人党在莫斯科举行国际会议 —— 这是共产国际与情报局相继解散之后，世界共产主义运动第一次以这种形式集会（另有 4 个党因怕在国内遭报复而秘密出席）。会议通过《和平宣言》，把资本主义垄断集团定为世界和平的主要威胁。此前 11 月 14 至 16 日，12 个执政党已先行签署一份共同宣言。—— 记于【en】1957 年共产党和工人党国际会议条，本项目据英文转译。"
 hof_ma_pol_moscow_1960:0 "1960 年莫斯科会议"
 hof_ma_pol_moscow_1960_desc:0 "1960 年 11 月 10 日至 12 月 1 日，81 个共产党和工人党在莫斯科举行会议，并发表题为《八十一个共产党和工人党声明》的共同文件。这次会议连着的正是中苏分歧：会前有 1960 年 6 月的布加勒斯特会议，会后的下一次同类集会要等到 1969 年。—— 记于【en】1960 年共产党和工人党国际会议条，本项目据英文转译。"
 hof_ma_pol_moscow_1969:0 "1969 年莫斯科会议"
 hof_ma_pol_moscow_1969_desc:0 "共产党和工人党国际会议于 1969 年 6 月 5 日至 17 日在莫斯科召开，时在中苏交恶与华约入侵捷克斯洛伐克之后。亲中派共产党均未出席；越南劳动党与朝鲜劳动党也因拒绝在中苏之间表态而未到。会议的两项重点是同反帝国主义力量合作的策略与列宁百年诞辰的庆祝 —— 前者被挪威、多米尼加和英国代表团拒绝签字。—— 记于〈共产党和工人党国际会议〉条，中文维基。"
 hof_ma_pol_first_secretaries:0 "第一书记与政府首脑会议"
 hof_ma_pol_first_secretaries_desc:0 "经互会最要紧、却又不在章程里的机关，是「共产党和工人党第一书记与政府首脑会议」。英文维基的原话就是「虽然不属于这个组织的正式层级」。机构表上找不到它，但所有真正的决定都在那里做出。—— 记于【en】Comecon 条「Structure」，本项目据英文转译。"
 hof_ma_pol_international_department:0 "苏共中央国际部"
 hof_ma_pol_international_department_desc:0 "苏共中央国际部建立于 1943 年共产国际解散之时，继承了共产国际的档案和部分人员；1957 年，它处理与执政共产党关系的职能被划进新成立的「社会主义国家共产党工人党联络部」。1955 至 1986 年由波诺马廖夫领导。它是一个部，不是一次会议 —— 换言之，它每天都在办公。—— 记于〈苏联共产党中央委员会国际部〉条，中文维基。"

 # ---------- 华沙条约组织（17 条）----------
 hof_ma_mil_warsaw_treaty:0 "华沙条约组织"
 hof_ma_mil_warsaw_treaty_desc:0 "1955 年 5 月 14 日，苏联与波兰、捷克斯洛伐克、匈牙利、罗马尼亚、保加利亚、阿尔巴尼亚及东德签订《友好合作互助条约》，正式名称为《友好合作互助条约组织》。八个签署国「重申他们希望建立一个基于所有欧洲国家参与的欧洲集体安全体系，无论其社会和政治制度如何」，以回应德意志联邦共和国加入北约。—— 记于〈华沙条约组织〉条，中文维基。"
 hof_ma_mil_joint_command:0 "联合武装部队司令部"
 hof_ma_mil_joint_command_desc:0 "联合武装部队司令部是华约的军事指挥机构，负责对华约武装部队的领导、训练、装备和调动。各缔约国派一名将军常驻；苏联国防部第一副部长任总司令（首任科涅夫，1955 至 1960 年），其他成员国的国防部长或副部长任副总司令。总指挥部在华沙，军事总部在莫斯科。—— 记于〈华沙条约组织〉条「结构」，中文维基。"
 hof_ma_mil_joint_staff:0 "联合武装部队总参谋部"
 hof_ma_mil_joint_staff_desc:0 "联合武装部队总参谋部与司令部同时设立，首任总参谋长安东诺夫大将（1955 至 1962 年）。华约的联合参谋长同时也是苏联武装力量第一副总参谋长。—— 记于〈华沙条约组织〉条「华沙条约组织武装部队历任首长」，中文维基。"
 hof_ma_mil_political_consultative:0 "政治协商委员会"
 hof_ma_mil_political_consultative_desc:0 "政治协商委员会是华约的最高决策机构，由各缔约国党的总书记或第一书记、国家元首、总理、国防部长和外交部长组成，负责协商和决定缔约国的国防、政治、外交和经济等重大问题。第一次会议 1956 年 1 月在布拉格举行。—— 记于〈华沙条约组织〉条「结构」，中文维基。"
 hof_ma_mil_standing_bodies:0 "联合秘书处与常设委员会"
 hof_ma_mil_standing_bodies_desc:0 "政治协商委员会下设的两条常设腿：常设委员会（驻莫斯科，负责政策准备）与联合秘书处（执行机构，也设在莫斯科）。一个负责想，一个负责办。—— 记于〈华沙条约组织〉条「结构」，中文维基。"
 hof_ma_mil_integrated_units:0 "一体化部队"
 hof_ma_mil_integrated_units_desc:0 "除各国自有的军队之外，条约体系里还有直接归联合司令部的一体化部队与分队。这一层部队不挂在任何一国的国防部下面，是「联合」这两个字最实的部分。—— 记于〈华沙条约组织〉条「结构」，中文维基。"
 hof_ma_mil_unified_equipment:0 "统一装备制式"
 hof_ma_mil_unified_equipment_desc:0 "冷战期间，苏联按自己的样子塑造东欧各国军队，把它们整成准备与北约对抗的部队 —— 装备制式统一是这件事的一部分：一国的弹药在另一国的枪里能用，一国的油料加进另一国的坦克。而统一之所以维持得住，靠的是指挥链：联合武装部队总司令与总参谋长历来由苏联国防部第一副部长、苏联武装部队第一副总参谋长出任。—— 记于【en】Warsaw Pact 条＋〈华沙条约组织〉条「结构」，本项目据英文/中文转译。"
 hof_ma_mil_air_defence:0 "统一防空系统"
 hof_ma_mil_air_defence_desc:0 "联合武装部队司令部的职责是「对华约武装部队的领导、训练、装备和调动」，而它指挥与控制的是成员国的全部军事力量；总司令同时是苏联国防部第一副部长。防空是这件事里最不能分国界的一项 —— 空情图上一条线画错，后面所有拦截都错。本节点按用户口径把防空落到首都。—— 记于〈华沙条约组织〉条「结构」，中文维基；＋【en】Warsaw Pact 条，本项目据英文转译。"
 hof_ma_mil_joint_exercises:0 "联合演习"
 hof_ma_mil_joint_exercises_desc:0 "1961 年起举行「友谊演习」等年度联合演习。联合部队在入侵演习中反复演练大规模使用核武器，例如 1964 年捷克方向的计划与「七日抵达莱茵河」演习。把损耗练在演习场里，就少练在战场上。—— 记于〈华沙条约组织〉条，中文维基。"
 hof_ma_mil_doctrine:0 "统一军事学说"
 hof_ma_mil_doctrine_desc:0 "阿尔巴尼亚 1968 年退出后，罗马尼亚仍是唯一拥有独立军事学说的条约成员国 —— 该学说否认苏联有权使用其武装力量，并避免绝对依赖苏联的军事装备来源。它也是唯一在遭受武装袭击时没有义务对苏联进行军事防御的非苏联成员国。一份共同条令里，这一个是例外。—— 记于〈华沙条约组织〉条「罗马尼亚和阿尔巴尼亚」，中文维基。"
 hof_ma_mil_officer_training:0 "军官培养体系"
 hof_ma_mil_officer_training_desc:0 "华约的军官训练不走各国自办的路：国防部长委员会的主要任务之一就是研究「联合武装部队的训练、演习、组织建设等问题」，而联合武装部队总司令历来由苏联国防部第一副部长出任、总参谋长历来由苏联武装部队第一副总参谋长出任。训练大纲与指挥岗位用的是同一套体系 —— 一批人在同一间教室里读完同一套教材，这比任何一份共同条令都更牢固。—— 记于〈华沙条约组织〉条「结构」，中文维基。"
 hof_ma_mil_licensed_production:0 "许可生产与军事技术援助"
 hof_ma_mil_licensed_production_desc:0 "华约各国的装备来源本来统一在苏联身上 —— 到 1960 年代末，罗马尼亚之所以被单列出来，正因为它「避免绝对依赖苏联的军事装备来源」，后来连情报与安全部门的苏联顾问都撤了出去。也就是说，默认状态就是依赖：许可生产把「援助」变成了「同一套图纸」。—— 记于〈华沙条约组织〉条「罗马尼亚和阿尔巴尼亚」，中文维基。"
 hof_ma_mil_defence_ministers:0 "国防部长委员会"
 hof_ma_mil_defence_ministers_desc:0 "国防部长委员会是华约的最高军事机构，由缔约国国防部长、华约联合武装部队总司令和总参谋长等人组成，主要任务是研究共同的军事政策及联合武装部队的训练、演习、组织建设等问题。1969 年设立。—— 记于〈华沙条约组织〉条「结构」，中文维基。"
 hof_ma_mil_committees:0 "军事委员会与各专业委员会"
 hof_ma_mil_committees_desc:0 "政治协商委员会下设两条常设腿：常设委员会（驻莫斯科）与联合秘书处（设在莫斯科的执行机构）—— 一个负责想，一个负责办。1969 年 3 月 17 日布达佩斯会议在讨论欧洲安全的同时，也审议了「加强和完善华约军事组织」的问题，分口办事的各类专业委员会正是这一轮「完善」的产物：它们管的是最不体面也最要紧的事，油料表、备件号、运输时刻。—— 记于〈华沙条约组织〉条「结构」，中文维基；＋〈华沙条约组织〉条，俄文维基，本项目据俄文转译。"
 hof_ma_mil_mbfr:0 "维也纳裁军谈判"
 hof_ma_mil_mbfr_desc:0 "中欧相互均衡裁军谈判（MBFR，通称中欧裁军谈判）是关于中欧常规武装力量削减的一系列谈判，自 1973 年至 1989 年在维也纳举行，由北约与华约各成员国共同参加，预备性会谈 1973 年 1 月在维也纳举行。苏方拒绝「MBFR」这个名称，因为「均衡」一词暗示中欧占常规优势的华约本应比北约削减得更多。谈判本身没有谈成，但「坐下来」这件事持续了十五年。本节点按史实给西方四国好感修正。—— 记于〈中欧相互均衡裁军谈判〉条，中文维基。"
 hof_ma_mil_csce:0 "全欧安全会议"
 hof_ma_mil_csce_desc:0 "华约政治协商委员会 1969 年 3 月 17 日布达佩斯会议通过《关于加强欧洲和平与安全的宣言》，并向所有欧洲国家发出呼吁。此后是 1972 年 11 月起在埃斯波迪波利举行的大使级筹备会谈、1973 年 7 月 3 日赫尔辛基开幕的 35 国会议，以及 1975 年 7 月 30 日至 8 月 1 日由 35 个参加国签署的《赫尔辛基最后文件》。1955 年那句「所有欧洲国家参与的集体安全体系」，二十年后在这里落了地。—— 记于〈欧洲安全与合作会议〉条，中文维基；＋〈华沙条约组织〉条，俄文维基，本项目据俄文转译。"
 hof_ma_mil_nuclear:0 "核部署与作战计划"
 hof_ma_mil_nuclear_desc:0 "在成员国的核部署安排加上华约统一作战计划：1987 年波兰公开的核打击地图显示，计划假定北约首次打击后，用核武器对莱茵河以东的奥地利、丹麦、德国和荷兰实施短暂而迅速的入侵与占领。—— 记于〈华沙条约组织〉条「后华沙条约组织」，中文维基。"

