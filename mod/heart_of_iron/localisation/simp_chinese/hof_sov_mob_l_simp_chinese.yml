l_simp_chinese:
 # ============================================================================
 #  hof_sov_mob_l_simp_chinese.yml
 #  苏联「开战倒计时」决议 —— 本地化
 #
 #  设计出处：docs/97-soviet-war-countdown-design.md §3
 #  编码红线（AGENTS.md 硬性规则 3）：UTF-8 【带 BOM】+ CRLF
 #                                    文件名必须含 _l_simp_chinese
 #                                    首行必须是 l_simp_chinese:
 #
 #  ⭐⭐ v6（2026-09-25）：_desc / tooltip 里加了 **[FROM.GetName]**（目标国名）——
#     原版 targeted 决议的 _desc 就是这么写的（扫原版 simp_chinese：136 处 `_desc` 用 `[FROM.GetName]`）
#     ⇒ 玩家悬停就能看到「这张卡是谁的」（用户第六轮口径：悬停显示为空 ⇒ 原来我们根本没显示目标名）。
#  ⚠️ 文案口径：本文件的 _desc 是【机制说明】，不冒充史实、不引历史评价
 #     ⇒ 不属于硬性规则 9（"描述文本必须是节选"）的适用范围，因为它在陈述规则而非历史。
 # ============================================================================

 # ── 分类（决议面板里的页签） ──
 hof_sov_mob_category:0 "敌军动员"
 hof_sov_mob_category_desc:0 "与苏联交战的敌国正在动员装甲部队。每一条倒计时对应一个敌国。"

 # ── 倒计时任务 ──
 hof_sov_mob_war_countdown:0 "[hof_sov_mob_stage_title]"
 hof_sov_mob_title_early:0 "敌方正在动员摩托化坦克师！"
 hof_sov_mob_title_1941:0 "敌方正在动员机械化坦克师！"
 hof_sov_mob_title_1944:0 "敌方正在大规模动员机械化坦克师！"
 hof_sov_mob_war_countdown_desc:0 "§Y[FROM.GetName]§![hof_sov_mob_stage_desc]\n\n若§Y[FROM.GetName]§!已不存在、已失去全部领土，或苏联与该国不再处于战争状态，动员立即中止，敌方不会获得任何部队。\n\n本任务无法点选、也无法手动中止；有效敌国在战争期间每约 30 日完成一轮动员。"
 hof_sov_mob_desc_early:0 "正在把民用工厂转产为装甲与摩托化装备，新的摩托化坦克师正在编成之中。\n\n倒计时结束时，该国将在自己的首都或其他受控州获得 §Y100§! 个摩托化坦克师，装备免费配发。"
 hof_sov_mob_desc_1941:0 "正在动员机械化坦克师。\n\n倒计时结束时，该国将在自己的首都或其他受控州获得 §Y200§! 个机械化坦克师，装备免费配发。编制为 15 个中型坦克营、10 个机械化步兵营，以及工兵、通信、摩托化侦察、后勤、野战医院各一个支援连。"
 hof_sov_mob_desc_1944:0 "正在大规模动员机械化坦克师。\n\n倒计时结束时，该国将在自己的首都或其他受控州获得 §Y300§! 个机械化坦克师，装备免费配发，编制与 1941—1943 年相同。"

 # ── 倒计时结束时给玩家看的提示 ──
 hof_sov_mob_result_tt:0 "§R敌方动员完成：§Y[FROM.GetName]§!获得 100 个「摩托化坦克师」师。§!"
 hof_sov_mob_result_1941_tt:0 "§R敌方动员完成：§Y[FROM.GetName]§!获得 200 个「机械化坦克师」师。§!"
 hof_sov_mob_result_1944_tt:0 "§R敌方大规模动员完成：§Y[FROM.GetName]§!获得 300 个「机械化坦克师」师。§!"
